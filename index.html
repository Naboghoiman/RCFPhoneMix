<!DOCTYPE html>
<html>
<head>
<title>RCF Phone Mix</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>RCF Phone Mix</h1>

<div class="mixer">

<div class="channel">
<h3>Music</h3>
<input type="range" min="-12" max="12" value="0">
<p>Volume</p>
</div>

<div class="channel">
<h3>EQ</h3>
<label>Bass</label>
<input type="range" min="-12" max="12" value="0">

<label>Mid</label>
<input type="range" min="-12" max="12" value="0">

<label>Treble</label>
<input type="range" min="-12" max="12" value="0">
</div>

<div class="channel">
<h3>Master</h3>
<input type="range" min="-12" max="12" value="0">
<p>Output</p>
</div>

</div>

<script src="app.js"></script>

</body>
</html>
