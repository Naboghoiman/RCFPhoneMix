name: Build RCF Bridge Player VPN APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/RCFBridgePlayerVPN.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Create Android 12/13 RCF bridge project
        shell: bash
        run: |
          P="$RUNNER_TEMP/RCFBridgePlayer"
          mkdir -p "$P/app/src/main/java/com/rcfbridge/player"

          cat > "$P/settings.gradle" <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "RCFBridgePlayer"
          include ":app"
          EOF

          cat > "$P/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.10.1' apply false
          }
          EOF

          cat > "$P/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > "$P/app/build.gradle" <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.rcfbridge.player'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.rcfbridge.player'
                  minSdk 23
                  targetSdk 33
                  versionCode 3
                  versionName '3.0-vpn'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > "$P/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:label="RCF Bridge Player"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".BridgeVpnService"
                      android:exported="false"
                      android:permission="android.permission.BIND_VPN_SERVICE"
                      android:foregroundServiceType="mediaPlayback">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat > "$P/app/src/main/java/com/rcfbridge/player/MainActivity.java" <<'EOF'
          package com.rcfbridge.player;

          import android.app.Activity;
          import android.content.Intent;
          import android.database.Cursor;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.net.Uri;
          import android.net.VpnService;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.OpenableColumns;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private static final int PICK_AUDIO = 7001;
              private static final int PREPARE_VPN = 7002;

              private final Handler handler = new Handler(Looper.getMainLooper());
              private TextView track;
              private TextView vpnStatus;
              private TextView oscStatus;
              private TextView audioStatus;
              private Button playButton;

              private final Runnable statusTick = new Runnable() {
                  @Override public void run() {
                      vpnStatus.setText(BridgeVpnService.vpnStatus);
                      oscStatus.setText(BridgeVpnService.oscStatus);
                      audioStatus.setText(BridgeVpnService.audioStatus);
                      playButton.setText(BridgeVpnService.isPlaying ? "PAUSE" : "PLAY");
                      handler.postDelayed(this, 350L);
                  }
              };

              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  buildUi();
                  handler.post(statusTick);
              }

              private void buildUi() {
                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);
                  scroll.setBackgroundColor(Color.rgb(7, 11, 16));

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(16), dp(20), dp(16), dp(32));

                  TextView logo = text("RCF", 40, Color.WHITE, true);
                  logo.setGravity(Gravity.CENTER);
                  root.addView(logo, full());

                  TextView title = text("PHONE BRIDGE PLAYER", 18, Color.rgb(39, 164, 220), true);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title, full());

                  TextView sub = text("ANDROID 12 / 13  •  ORIGINAL MIXREMOTE", 11, Color.LTGRAY, false);
                  sub.setGravity(Gravity.CENTER);
                  sub.setPadding(0, dp(4), 0, dp(18));
                  root.addView(sub, full());

                  Button bridge = button("START RCF BRIDGE");
                  bridge.setOnClickListener(v -> prepareVpn());
                  root.addView(bridge, height(54));

                  vpnStatus = status("Bridge stopped");
                  root.addView(vpnStatus, fullTop(10));

                  Button choose = button("SELECT MUSIC");
                  choose.setOnClickListener(v -> chooseMusic());
                  root.addView(choose, heightTop(54, 18));

                  track = text("No music selected", 15, Color.WHITE, true);
                  track.setGravity(Gravity.CENTER);
                  track.setPadding(dp(6), dp(12), dp(6), dp(8));
                  root.addView(track, full());

                  playButton = button("PLAY");
                  playButton.setOnClickListener(v -> sendService(BridgeVpnService.ACTION_TOGGLE, null));
                  root.addView(playButton, height(52));

                  TextView oscHeading = text("RCF CONTROL", 12, Color.rgb(39,164,220), true);
                  oscHeading.setPadding(0, dp(22), 0, dp(6));
                  root.addView(oscHeading, full());

                  oscStatus = status("Waiting for MixRemote packets…");
                  root.addView(oscStatus, full());

                  TextView audioHeading = text("PHONE AUDIO", 12, Color.rgb(39,164,220), true);
                  audioHeading.setPadding(0, dp(22), 0, dp(6));
                  root.addView(audioHeading, full());

                  audioStatus = status("Select a song.");
                  root.addView(audioStatus, full());

                  TextView instructions = text(
                          "Use: 1) START RCF BRIDGE and allow the VPN.  2) SELECT MUSIC and PLAY.  3) Open the original RCF MixRemote app.  4) Move an EQ gain. The player catches the RCF OSC command locally and applies it to the song.",
                          12, Color.LTGRAY, false);
                  instructions.setPadding(dp(4), dp(24), dp(4), 0);
                  root.addView(instructions, full());

                  scroll.addView(root);
                  setContentView(scroll);
              }

              private void prepareVpn() {
                  Intent permission = VpnService.prepare(this);
                  if (permission != null) {
                      startActivityForResult(permission, PREPARE_VPN);
                  } else {
                      startBridge();
                  }
              }

              private void startBridge() {
                  Intent i = new Intent(this, BridgeVpnService.class);
                  i.setAction(BridgeVpnService.ACTION_START);
                  if (Build.VERSION.SDK_INT >= 26) startForegroundService(i); else startService(i);
              }

              private void chooseMusic() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("audio/*");
                  startActivityForResult(i, PICK_AUDIO);
              }

              @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == PREPARE_VPN) {
                      if (resultCode == RESULT_OK) startBridge();
                      else Toast.makeText(this, "VPN permission is needed to connect the original RCF app.", Toast.LENGTH_LONG).show();
                      return;
                  }
                  if (requestCode != PICK_AUDIO || resultCode != RESULT_OK || data == null || data.getData() == null) return;

                  Uri uri = data.getData();
                  try {
                      int flags = data.getFlags() & Intent.FLAG_GRANT_READ_URI_PERMISSION;
                      getContentResolver().takePersistableUriPermission(uri, flags);
                  } catch (Exception ignored) {}

                  track.setText(displayName(uri));
                  sendService(BridgeVpnService.ACTION_LOAD, uri);
              }

              private void sendService(String action, Uri uri) {
                  Intent i = new Intent(this, BridgeVpnService.class);
                  i.setAction(action);
                  if (uri != null) i.setData(uri);
                  if (Build.VERSION.SDK_INT >= 26) startForegroundService(i); else startService(i);
              }

              private String displayName(Uri uri) {
                  Cursor c = null;
                  try {
                      c = getContentResolver().query(uri, new String[]{OpenableColumns.DISPLAY_NAME}, null, null, null);
                      if (c != null && c.moveToFirst()) {
                          int index = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                          if (index >= 0) {
                              String n = c.getString(index);
                              if (n != null && !n.isEmpty()) return n;
                          }
                      }
                  } catch (Exception ignored) {
                  } finally {
                      if (c != null) c.close();
                  }
                  return "Selected music";
              }

              @Override protected void onDestroy() {
                  handler.removeCallbacks(statusTick);
                  super.onDestroy();
              }

              private TextView status(String s) {
                  TextView v = text(s, 13, Color.LTGRAY, false);
                  v.setGravity(Gravity.CENTER);
                  v.setPadding(dp(8), dp(8), dp(8), dp(8));
                  v.setBackgroundColor(Color.rgb(22, 29, 37));
                  return v;
              }

              private TextView text(String s, int size, int color, boolean bold) {
                  TextView v = new TextView(this);
                  v.setText(s);
                  v.setTextSize(size);
                  v.setTextColor(color);
                  if (bold) v.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  return v;
              }

              private Button button(String s) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setTextColor(Color.WHITE);
                  b.setTextSize(13);
                  b.setAllCaps(false);
                  return b;
              }

              private LinearLayout.LayoutParams full() { return new LinearLayout.LayoutParams(-1, -2); }
              private LinearLayout.LayoutParams fullTop(int top) { LinearLayout.LayoutParams p = full(); p.setMargins(0, dp(top), 0, 0); return p; }
              private LinearLayout.LayoutParams height(int h) { return new LinearLayout.LayoutParams(-1, dp(h)); }
              private LinearLayout.LayoutParams heightTop(int h, int top) { LinearLayout.LayoutParams p = height(h); p.setMargins(0, dp(top), 0, 0); return p; }
              private int dp(int n) { return Math.round(n * getResources().getDisplayMetrics().density); }
          }
          EOF

          cat > "$P/app/src/main/java/com/rcfbridge/player/BridgeVpnService.java" <<'EOF'
          package com.rcfbridge.player;
          
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.media.AudioAttributes;
          import android.media.MediaPlayer;
          import android.media.audiofx.Equalizer;
          import android.net.Uri;
          import android.net.VpnService;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.ParcelFileDescriptor;
          
          import java.io.ByteArrayOutputStream;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.nio.ByteBuffer;
          import java.nio.ByteOrder;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;
          
          public class BridgeVpnService extends VpnService {
              public static final String ACTION_START = "com.rcfbridge.player.START";
              public static final String ACTION_LOAD = "com.rcfbridge.player.LOAD";
              public static final String ACTION_TOGGLE = "com.rcfbridge.player.TOGGLE";
          
              public static volatile String vpnStatus = "Bridge stopped";
              public static volatile String oscStatus = "Waiting for MixRemote packets…";
              public static volatile String audioStatus = "Select a song.";
              public static volatile boolean isPlaying = false;
          
              private static final int NOTIFICATION_ID = 80;
              private static final String CHANNEL_ID = "rcf_bridge";
          
              private ParcelFileDescriptor tun;
              private Thread packetThread;
              private volatile boolean running;
              private MediaPlayer player;
              private Equalizer equalizer;
              private int packetId = 1;
          
              @Override public IBinder onBind(Intent intent) {
                  return super.onBind(intent);
              }
          
              @Override public int onStartCommand(Intent intent, int flags, int startId) {
                  startForegroundNow();
                  if (intent == null) return START_STICKY;
                  String action = intent.getAction();
                  if (ACTION_START.equals(action)) {
                      startVpn();
                  } else if (ACTION_LOAD.equals(action) && intent.getData() != null) {
                      loadSong(intent.getData());
                  } else if (ACTION_TOGGLE.equals(action)) {
                      togglePlayback();
                  }
                  return START_STICKY;
              }
          
              private void startForegroundNow() {
                  NotificationManager nm = (NotificationManager)getSystemService(NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel(CHANNEL_ID, "RCF Bridge", NotificationManager.IMPORTANCE_LOW);
                      nm.createNotificationChannel(ch);
                  }
                  Intent open = new Intent(this, MainActivity.class);
                  int piFlags = PendingIntent.FLAG_UPDATE_CURRENT;
                  if (Build.VERSION.SDK_INT >= 23) piFlags |= PendingIntent.FLAG_IMMUTABLE;
                  PendingIntent pi = PendingIntent.getActivity(this, 0, open, piFlags);
                  Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, CHANNEL_ID) : new Notification.Builder(this);
                  b.setSmallIcon(android.R.drawable.ic_media_play)
                          .setContentTitle("RCF Bridge Player")
                          .setContentText("Ready to receive MixRemote controls")
                          .setContentIntent(pi)
                          .setOngoing(true);
                  startForeground(NOTIFICATION_ID, b.build());
              }
          
              private synchronized void startVpn() {
                  if (tun != null) {
                      vpnStatus = "RCF bridge ACTIVE — original MixRemote is routed locally";
                      return;
                  }
                  try {
                      Builder b = new Builder()
                              .setSession("RCF M18 Phone Bridge")
                              .setMtu(1500)
                              .addAddress("10.77.0.1", 32)
                              .addRoute("0.0.0.0", 0);
          
                      // Route ONLY the official MixRemote app through this local bridge.
                      // All other phone apps keep their normal network connection.
                      try {
                          b.addAllowedApplication("com.rcf.mixremote");
                      } catch (android.content.pm.PackageManager.NameNotFoundException e) {
                          vpnStatus = "Install the ORIGINAL RCF MixRemote first, then press START RCF BRIDGE.";
                          return;
                      }
          
                      if (Build.VERSION.SDK_INT >= 21) b.setBlocking(true);
                      tun = b.establish();
                      if (tun == null) {
                          vpnStatus = "Bridge could not start — VPN permission missing";
                          return;
                      }
                      running = true;
                      packetThread = new Thread(this::packetLoop, "RCF-VPN-PACKET");
                      packetThread.start();
                      vpnStatus = "RCF bridge ACTIVE — open original MixRemote";
                  } catch (Exception e) {
                      vpnStatus = "Bridge error: " + safe(e.getMessage());
                  }
              }
          
              private void packetLoop() {
                  try (FileInputStream in = new FileInputStream(tun.getFileDescriptor());
                       FileOutputStream out = new FileOutputStream(tun.getFileDescriptor())) {
                      byte[] buf = new byte[32767];
                      while (running) {
                          int n = in.read(buf);
                          if (n <= 0) continue;
                          handleIpPacket(buf, n, out);
                      }
                  } catch (Exception e) {
                      if (running) vpnStatus = "Bridge packet error: " + safe(e.getMessage());
                  }
              }
          
              private void handleIpPacket(byte[] packet, int len, FileOutputStream out) throws IOException {
                  if (len < 28) return;
                  int version = (packet[0] >> 4) & 0x0F;
                  if (version != 4) return;
                  int ihl = (packet[0] & 0x0F) * 4;
                  if (ihl < 20 || len < ihl + 8) return;
                  int protocol = packet[9] & 0xFF;
                  if (protocol != 17) return;
          
                  int srcPort = u16(packet, ihl);
                  int dstPort = u16(packet, ihl + 2);
                  int udpLength = u16(packet, ihl + 4);
                  int payloadOffset = ihl + 8;
                  int payloadLength = Math.min(Math.max(0, udpLength - 8), len - payloadOffset);
                  if (payloadLength <= 0) return;
          
                  byte[] srcIp = new byte[]{packet[12], packet[13], packet[14], packet[15]};
                  byte[] dstIp = new byte[]{packet[16], packet[17], packet[18], packet[19]};
          
                  List<OscMessage> messages = new ArrayList<>();
                  parseOsc(packet, payloadOffset, payloadLength, messages);
                  for (OscMessage m : messages) {
                      onOsc(m);
                      byte[] reply = createReply(m);
                      if (reply != null) {
                          byte[] ipReply = buildUdpIpv4(dstIp, srcIp, 8000, 9000, reply);
                          out.write(ipReply);
                          out.flush();
                      }
                  }
              }
          
              private void onOsc(OscMessage m) {
                  oscStatus = "RCF → phone: " + m.address + (m.firstFloat != null ? "  " + String.format(Locale.US, "%.3f", m.firstFloat) : "");
                  if (m.firstFloat == null) return;
                  float v = m.firstFloat;
          
                  if (m.address.matches("^/\\d{2}/\\d{2}/eq_002$")) {
                      if (equalizer != null) {
                          try {
                              equalizer.setEnabled(v >= 0.5f);
                              audioStatus = v >= 0.5f ? "RCF EQ enabled" : "RCF EQ bypassed";
                          } catch (Exception ignored) {}
                      }
                      return;
                  }
          
                  int bandSlot = -1;
                  if (m.address.matches("^/\\d{2}/\\d{2}/eq_003$")) bandSlot = 0;
                  else if (m.address.matches("^/\\d{2}/\\d{2}/eq_007$")) bandSlot = 1;
                  else if (m.address.matches("^/\\d{2}/\\d{2}/eq_010$")) bandSlot = 2;
                  else if (m.address.matches("^/\\d{2}/\\d{2}/eq_013$")) bandSlot = 3;
          
                  if (bandSlot >= 0) {
                      applyEqBand(bandSlot, v);
                      return;
                  }
          
                  if (m.address.matches("^/00/00/fd_000$") || m.address.matches("^/01/\\d{2}/fd_000$")) {
                      if (player != null) {
                          float vol = clamp(v, 0f, 1f);
                          try { player.setVolume(vol, vol); } catch (Exception ignored) {}
                          audioStatus = "RCF fader → phone volume " + Math.round(vol * 100f) + "%";
                      }
                  }
              }
          
              private void applyEqBand(int slot, float rcfValue) {
                  if (equalizer == null) {
                      audioStatus = "RCF command received, but Android EQ is unavailable on this phone";
                      return;
                  }
                  try {
                      short bands = equalizer.getNumberOfBands();
                      if (bands <= 0) return;
                      int band = Math.round(slot * (bands - 1) / 3f);
                      short[] range = equalizer.getBandLevelRange();
                      float bipolar = clamp((rcfValue - 0.5f) * 2f, -1f, 1f);
                      int level = bipolar >= 0 ? Math.round(bipolar * range[1]) : Math.round((-bipolar) * range[0]);
                      level = Math.max(range[0], Math.min(range[1], level));
                      equalizer.setBandLevel((short)band, (short)level);
                      int hz = equalizer.getCenterFreq((short)band) / 1000;
                      audioStatus = "RCF EQ band " + (slot + 1) + " → " + hz + " Hz, " + String.format(Locale.US, "%+.1f dB", level / 100f);
                  } catch (Exception e) {
                      audioStatus = "EQ apply error: " + safe(e.getMessage());
                  }
              }
          
              private byte[] createReply(OscMessage m) {
                  if ("/22/00/gb_100".equals(m.address)) return oscStringReply(m.address, "02.10.0225");
                  if ("/22/00/gb_146".equals(m.address)) return oscStringReply(m.address, "0");
                  if ("/22/00/gb_275".equals(m.address)) return oscStringReply(m.address, "RCFBRIDGE001");
                  if ("/27/00/gb_078".equals(m.address) || "/27/00/gb_78".equals(m.address)) return oscStringReply(m.address, "");
                  if ("/00/00/pl_000".equals(m.address)) return oscMeterReply();
                  return null;
              }
          
              private byte[] oscStringReply(String address, String value) {
                  ByteArrayOutputStream out = new ByteArrayOutputStream();
                  writeOscString(out, address);
                  writeOscString(out, ",s");
                  writeOscString(out, value);
                  return out.toByteArray();
              }
          
              private byte[] oscMeterReply() {
                  ByteArrayOutputStream out = new ByteArrayOutputStream();
                  writeOscString(out, "/00/00/vmeter_000");
                  StringBuilder tags = new StringBuilder(",");
                  for (int i = 0; i < 41; i++) tags.append('f');
                  writeOscString(out, tags.toString());
                  for (int i = 0; i < 41; i++) writeInt(out, Float.floatToIntBits(0f));
                  return out.toByteArray();
              }
          
              private void parseOsc(byte[] data, int off, int len, List<OscMessage> out) {
                  if (len <= 0 || off < 0 || off + len > data.length) return;
                  if (len >= 16 && starts(data, off, "#bundle")) {
                      int pos = off + 16;
                      int end = off + len;
                      while (pos + 4 <= end) {
                          int size = readInt(data, pos);
                          pos += 4;
                          if (size <= 0 || pos + size > end) break;
                          parseOsc(data, pos, size, out);
                          pos += size;
                      }
                      return;
                  }
          
                  OscString address = readOscString(data, off, off + len);
                  if (address == null || !address.value.startsWith("/")) return;
                  OscString tags = readOscString(data, address.next, off + len);
                  if (tags == null || !tags.value.startsWith(",")) return;
                  int pos = tags.next;
                  Float firstFloat = null;
                  String firstString = null;
          
                  for (int i = 1; i < tags.value.length(); i++) {
                      char t = tags.value.charAt(i);
                      if (t == 'f' && pos + 4 <= off + len) {
                          float f = Float.intBitsToFloat(readInt(data, pos));
                          if (firstFloat == null) firstFloat = f;
                          pos += 4;
                      } else if (t == 'i' && pos + 4 <= off + len) {
                          int iv = readInt(data, pos);
                          if (firstFloat == null) firstFloat = (float)iv;
                          pos += 4;
                      } else if (t == 's') {
                          OscString s = readOscString(data, pos, off + len);
                          if (s == null) return;
                          if (firstString == null) firstString = s.value;
                          pos = s.next;
                      } else {
                          return;
                      }
                  }
                  out.add(new OscMessage(address.value, firstFloat, firstString));
              }
          
              private byte[] buildUdpIpv4(byte[] src, byte[] dst, int srcPort, int dstPort, byte[] payload) {
                  int total = 20 + 8 + payload.length;
                  byte[] p = new byte[total];
                  p[0] = 0x45;
                  p[1] = 0;
                  put16(p, 2, total);
                  put16(p, 4, packetId++ & 0xFFFF);
                  put16(p, 6, 0);
                  p[8] = 64;
                  p[9] = 17;
                  System.arraycopy(src, 0, p, 12, 4);
                  System.arraycopy(dst, 0, p, 16, 4);
                  put16(p, 20, srcPort);
                  put16(p, 22, dstPort);
                  put16(p, 24, 8 + payload.length);
                  put16(p, 26, 0); // IPv4 UDP checksum is optional.
                  System.arraycopy(payload, 0, p, 28, payload.length);
                  put16(p, 10, ipChecksum(p, 0, 20));
                  return p;
              }
          
              private int ipChecksum(byte[] b, int off, int len) {
                  long sum = 0;
                  for (int i = off; i < off + len; i += 2) {
                      int word = (b[i] & 0xFF) << 8;
                      if (i + 1 < off + len) word |= b[i + 1] & 0xFF;
                      sum += word;
                      while ((sum & 0xFFFF0000L) != 0) sum = (sum & 0xFFFFL) + (sum >>> 16);
                  }
                  return (int)(~sum) & 0xFFFF;
              }
          
              private synchronized void loadSong(Uri uri) {
                  releaseAudio();
                  audioStatus = "Loading music…";
                  player = new MediaPlayer();
                  player.setAudioAttributes(new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_MEDIA)
                          .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                          .build());
                  player.setOnPreparedListener(mp -> {
                      attachEq(mp.getAudioSessionId());
                      audioStatus = equalizer == null ? "Music ready — Android EQ unavailable" : "Music ready — EQ attached to phone audio";
                      isPlaying = false;
                  });
                  player.setOnCompletionListener(mp -> {
                      isPlaying = false;
                      try { mp.seekTo(0); } catch (Exception ignored) {}
                  });
                  player.setOnErrorListener((mp, what, extra) -> {
                      audioStatus = "Music playback error " + what + "/" + extra;
                      isPlaying = false;
                      return true;
                  });
                  try {
                      player.setDataSource(this, uri);
                      player.prepareAsync();
                  } catch (Exception e) {
                      audioStatus = "Unable to open music: " + safe(e.getMessage());
                  }
              }
          
              private void attachEq(int sessionId) {
                  releaseEq();
                  try {
                      equalizer = new Equalizer(0, sessionId);
                      equalizer.setEnabled(true);
                  } catch (Exception e) {
                      equalizer = null;
                  }
              }
          
              private synchronized void togglePlayback() {
                  if (player == null) {
                      audioStatus = "Select music first.";
                      return;
                  }
                  try {
                      if (player.isPlaying()) {
                          player.pause();
                          isPlaying = false;
                      } else {
                          player.start();
                          isPlaying = true;
                      }
                  } catch (IllegalStateException e) {
                      audioStatus = "Music is still loading.";
                  }
              }
          
              private void releaseEq() {
                  if (equalizer != null) {
                      try { equalizer.release(); } catch (Exception ignored) {}
                      equalizer = null;
                  }
              }
          
              private void releaseAudio() {
                  releaseEq();
                  if (player != null) {
                      try { player.release(); } catch (Exception ignored) {}
                      player = null;
                  }
                  isPlaying = false;
              }
          
              @Override public void onDestroy() {
                  running = false;
                  if (tun != null) {
                      try { tun.close(); } catch (Exception ignored) {}
                      tun = null;
                  }
                  releaseAudio();
                  vpnStatus = "Bridge stopped";
                  stopForeground(true);
                  super.onDestroy();
              }
          
              private static int u16(byte[] b, int p) { return ((b[p] & 0xFF) << 8) | (b[p + 1] & 0xFF); }
              private static void put16(byte[] b, int p, int v) { b[p] = (byte)((v >>> 8) & 0xFF); b[p + 1] = (byte)(v & 0xFF); }
              private static int readInt(byte[] b, int p) { return ByteBuffer.wrap(b, p, 4).order(ByteOrder.BIG_ENDIAN).getInt(); }
          
              private static void writeInt(ByteArrayOutputStream out, int v) {
                  out.write((v >>> 24) & 0xFF);
                  out.write((v >>> 16) & 0xFF);
                  out.write((v >>> 8) & 0xFF);
                  out.write(v & 0xFF);
              }
          
              private static void writeOscString(ByteArrayOutputStream out, String s) {
                  byte[] bytes = s.getBytes(StandardCharsets.UTF_8);
                  out.write(bytes, 0, bytes.length);
                  out.write(0);
                  while ((out.size() & 3) != 0) out.write(0);
              }
          
              private static OscString readOscString(byte[] b, int pos, int end) {
                  if (pos < 0 || pos >= end) return null;
                  int z = pos;
                  while (z < end && b[z] != 0) z++;
                  if (z >= end) return null;
                  String s = new String(b, pos, z - pos, StandardCharsets.UTF_8);
                  int next = (z + 4) & ~3;
                  if (next > end) return null;
                  return new OscString(s, next);
              }
          
              private static boolean starts(byte[] b, int off, String s) {
                  byte[] x = s.getBytes(StandardCharsets.US_ASCII);
                  if (off + x.length > b.length) return false;
                  for (int i = 0; i < x.length; i++) if (b[off + i] != x[i]) return false;
                  return true;
              }
          
              private static float clamp(float v, float min, float max) { return Math.max(min, Math.min(max, v)); }
              private static String safe(String s) { return s == null ? "unknown" : s; }
          
              private static final class OscString {
                  final String value; final int next;
                  OscString(String value, int next) { this.value = value; this.next = next; }
              }
          
              private static final class OscMessage {
                  final String address;
                  final Float firstFloat;
                  final String firstString;
                  OscMessage(String address, Float firstFloat, String firstString) {
                      this.address = address;
                      this.firstFloat = firstFloat;
                      this.firstString = firstString;
                  }
              }
          }

          EOF

      - name: Build installable APK
        shell: bash
        run: |
          P="$RUNNER_TEMP/RCFBridgePlayer"
          gradle --no-daemon --stacktrace -p "$P" :app:assembleDebug
          cp "$P/app/build/outputs/apk/debug/app-debug.apk" RCFBridgePlayer-Android12-13.apk
          sha256sum RCFBridgePlayer-Android12-13.apk > RCFBridgePlayer-Android12-13.sha256

      - name: Verify APK package and SDK
        shell: bash
        run: |
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging RCFBridgePlayer-Android12-13.apk | tee apk-badging.txt
          grep -q "package: name='com.rcfbridge.player'" apk-badging.txt
          grep -q "targetSdkVersion:'33'" apk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs RCFBridgePlayer-Android12-13.apk | tee apk-signature.txt

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: RCF-Bridge-Player-Android12-13
          path: |
            RCFBridgePlayer-Android12-13.apk
            RCFBridgePlayer-Android12-13.sha256
            apk-badging.txt
            apk-signature.txt
          if-no-files-found: error
