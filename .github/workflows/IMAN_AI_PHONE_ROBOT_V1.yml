              private void startVoice() {
                  Intent i = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                          RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, Locale.getDefault());
                  i.putExtra(RecognizerIntent.EXTRA_PROMPT, "Speak to IMAN");
                  try {
                      status.setText("LISTENING…");
                      startActivityForResult(i, VOICE_REQ);
                  } catch (Exception e) {
                      Toast.makeText(this, "Speech recognition is not available.", Toast.LENGTH_LONG).show();
                      status.setText("READY");
                  }
              }

              @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == VOICE_REQ) {
                      status.setText("READY");
                      if (resultCode == RESULT_OK && data != null) {
                          ArrayList<String> r = data.getStringArrayListExtra(
                                  RecognizerIntent.EXTRA_RESULTS);
                          if (r != null && !r.isEmpty()) handle(r.get(0));
                      }
                  }
              }

              private void handle(String userText) {
                  userText = userText == null ? "" : userText.trim();
                  if (userText.isEmpty()) return;

                  command.setText("");
                  conversation.setText("YOU: " + userText + "\n\nIMAN: Thinking…");
                  status.setText("THINKING ONLINE…");
                  ConversationMemory.add(this, "user", userText);

                  AiClient.send(this, userText, new AiClient.Callback() {
                      @Override public void onSuccess(AiClient.Action action) {
                          runOnUiThread(() -> {
                              String toolResult = PhoneTools.execute(MainActivity.this, action);
                              String spoken = action.response == null ? "" : action.response.trim();

                              if (!toolResult.isEmpty()) {
                                  if (spoken.isEmpty() ||
                                          !toolResult.toLowerCase(Locale.ROOT)
                                                  .contains(spoken.toLowerCase(Locale.ROOT))) {
                                      spoken = toolResult;
                                  }
                              }
                              if (spoken.isEmpty()) spoken = "Done.";

                              conversation.setText("YOU: " + userText +
                                      "\n\nIMAN: " + spoken +
                                      "\n\nACTION: " + action.action +
                                      (action.argument.isEmpty() ? "" : " → " + action.argument));
                              status.setText("READY • ONLINE AI");
                              ConversationMemory.add(MainActivity.this, "assistant", spoken);
                              speak(spoken);
                          });
                      }

                      @Override public void onError(String error) {
                          runOnUiThread(() -> {
                              conversation.setText("YOU: " + userText +
                                      "\n\nIMAN ERROR: " + error);
                              status.setText("AI CONNECTION ERROR");
                              if (error.contains("key is not set")) showApiKeyDialog();
                          });
                      }
                  });
              }

              private void speak(String s) {
                  if (tts != null) {
                      tts.speak(s, TextToSpeech.QUEUE_FLUSH, null, "iman_reply");
                  }
              }

              private void showApiKeyDialog() {
                  EditText input = new EditText(this);
                  input.setHint("sk-...");
                  input.setInputType(InputType.TYPE_CLASS_TEXT |
                          InputType.TYPE_TEXT_VARIATION_PASSWORD);

                  new AlertDialog.Builder(this)
                          .setTitle("Connect IMAN to the online AI brain")
                          .setMessage("Paste your OpenAI API key. It will be encrypted on this phone.")
                          .setView(input)
                          .setPositiveButton("SAVE", (d, w) -> {
                              String k = input.getText().toString().trim();
                              if (k.isEmpty()) return;
                              try {
                                  SecureKeyStore.save(this, k);
                                  status.setText("READY • ONLINE AI");
                                  Toast.makeText(this, "AI key saved securely.", Toast.LENGTH_SHORT).show();
                              } catch (Exception e) {
                                  Toast.makeText(this, "Could not save key: " + e.getMessage(),
                                          Toast.LENGTH_LONG).show();
                              }
                          })
                          .setNegativeButton("LATER", null)
                          .show();
              }

              private void requestPermissionsIfNeeded() {
                  List<String> p = new ArrayList<>();
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED)
                      p.add(Manifest.permission.RECORD_AUDIO);
                  if (checkSelfPermission(Manifest.permission.READ_CONTACTS) != PackageManager.PERMISSION_GRANTED)
                      p.add(Manifest.permission.READ_CONTACTS);
                  if (checkSelfPermission(Manifest.permission.CALL_PHONE) != PackageManager.PERMISSION_GRANTED)
                      p.add(Manifest.permission.CALL_PHONE);
                  if (checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED)
                      p.add(Manifest.permission.CAMERA);

                  if (Build.VERSION.SDK_INT >= 33) {
                      if (checkSelfPermission(Manifest.permission.READ_MEDIA_AUDIO) != PackageManager.PERMISSION_GRANTED)
                          p.add(Manifest.permission.READ_MEDIA_AUDIO);
                      if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED)
                          p.add(Manifest.permission.POST_NOTIFICATIONS);
                  } else {
                      if (checkSelfPermission(Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED)
                          p.add(Manifest.permission.READ_EXTERNAL_STORAGE);
                  }

                  if (!p.isEmpty()) requestPermissions(p.toArray(new String[0]), PERM_REQ);
              }

              private TextView text(String s, int sp, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(sp);
                  t.setTextColor(color);
                  if (bold) t.setTypeface(android.graphics.Typeface.DEFAULT_BOLD);
                  return t;
              }

              private Button button(String s) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setAllCaps(false);
                  return b;
              }

              private LinearLayout.LayoutParams full() {
                  return new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT);
              }

              private LinearLayout.LayoutParams top(int m) {
                  LinearLayout.LayoutParams p = full();
                  p.setMargins(0, dp(m), 0, 0);
                  return p;
              }

              private LinearLayout.LayoutParams weight() {
                  return new LinearLayout.LayoutParams(
                          0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);
              }

              private int dp(int v) {
                  return Math.round(v * getResources().getDisplayMetrics().density);
              }
          }
