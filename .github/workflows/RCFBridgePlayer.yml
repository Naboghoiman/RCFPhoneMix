name: Build RCF Bridge Player APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/RCFBridgePlayer.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Create Android project
        shell: bash
        run: |
          P="$RUNNER_TEMP/RCFBridgePlayer"
          mkdir -p "$P/app/src/main/java/com/rcfbridge/player"

          cat > "$P/settings.gradle" <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "RCFBridgePlayer"
          include ":app"
          EOF

          cat > "$P/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.10.1' apply false
          }
          EOF

          cat > "$P/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > "$P/app/build.gradle" <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.rcfbridge.player'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.rcfbridge.player'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > "$P/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="RCF Bridge Player"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "$P/app/src/main/java/com/rcfbridge/player/MainActivity.java" <<'EOF'
          package com.rcfbridge.player;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.media.AudioAttributes;
          import android.media.MediaPlayer;
          import android.media.audiofx.Equalizer;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.OpenableColumns;
          import android.database.Cursor;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.IOException;
          import java.net.DatagramPacket;
          import java.net.DatagramSocket;
          import java.net.InetSocketAddress;
          import java.nio.ByteBuffer;
          import java.nio.ByteOrder;
          import java.nio.charset.StandardCharsets;
          import java.util.Locale;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class MainActivity extends Activity {
              private static final int PICK_AUDIO = 7001;
              private static final int RCF_PORT = 8000;
              private static final Pattern RCF_EQ = Pattern.compile("^/(\\d{2})/(\\d{2})/(eq|gq)_(\\d{3})$");

              private final Handler ui = new Handler(Looper.getMainLooper());
              private MediaPlayer player;
              private Equalizer equalizer;
              private DatagramSocket oscSocket;
              private Thread oscThread;
              private boolean running;

              private TextView songName;
              private TextView rcfStatus;
              private TextView eqStatus;
              private Button play;
              private SeekBar progress;
              private boolean seeking;

              private final Runnable progressTick = new Runnable() {
                  @Override public void run() {
                      try {
                          if (player != null && !seeking && player.getDuration() > 0) {
                              progress.setProgress((int)((long)player.getCurrentPosition() * 1000L / player.getDuration()));
                          }
                      } catch (Exception ignored) {}
                      ui.postDelayed(this, 400);
                  }
              };

              @Override protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  buildUi();
                  startOscServer();
                  ui.post(progressTick);
              }

              private void buildUi() {
                  ScrollView scroll = new ScrollView(this);
                  scroll.setBackgroundColor(Color.rgb(8, 12, 17));
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(16), dp(22), dp(16), dp(30));

                  TextView logo = label("RCF", 40, Color.WHITE, true);
                  logo.setGravity(Gravity.CENTER);
                  root.addView(logo, full());

                  TextView title = label("BRIDGE PLAYER", 18, Color.rgb(39,164,220), true);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title, full());

                  TextView sub = label("LOCAL MUSIC  •  RCF EQ CONTROL", 11, Color.LTGRAY, false);
                  sub.setGravity(Gravity.CENTER);
                  sub.setPadding(0, dp(4), 0, dp(20));
                  root.addView(sub, full());

                  songName = label("No music selected", 16, Color.WHITE, true);
                  songName.setGravity(Gravity.CENTER);
                  root.addView(songName, full());

                  progress = new SeekBar(this);
                  progress.setMax(1000);
                  progress.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      public void onProgressChanged(SeekBar b, int p, boolean fromUser) {}
                      public void onStartTrackingTouch(SeekBar b) { seeking = true; }
                      public void onStopTrackingTouch(SeekBar b) {
                          if (player != null && player.getDuration() > 0) {
                              player.seekTo((int)((long)player.getDuration() * b.getProgress() / 1000L));
                          }
                          seeking = false;
                      }
                  });
                  root.addView(progress, full());

                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  Button choose = button("SELECT MUSIC");
                  choose.setOnClickListener(v -> chooseMusic());
                  row.addView(choose, weight());

                  play = button("PLAY");
                  play.setEnabled(false);
                  play.setOnClickListener(v -> togglePlay());
                  LinearLayout.LayoutParams wp = weight(); wp.setMargins(dp(8),0,0,0);
                  row.addView(play, wp);
                  root.addView(row, fullTop(16));

                  rcfStatus = label("RCF bridge: listening on UDP 8000", 13, Color.rgb(42,190,105), true);
                  rcfStatus.setGravity(Gravity.CENTER);
                  rcfStatus.setPadding(dp(8), dp(22), dp(8), dp(8));
                  root.addView(rcfStatus, full());

                  eqStatus = label("Select a song, press PLAY, then open the RCF app and move an EQ gain.", 13, Color.LTGRAY, false);
                  eqStatus.setGravity(Gravity.CENTER);
                  root.addView(eqStatus, full());

                  TextView note = label("The RCF app sends its control message to this player. The player applies the change to the same Android audio session that is playing your song.", 11, Color.GRAY, false);
                  note.setGravity(Gravity.CENTER);
                  note.setPadding(dp(8), dp(18), dp(8), 0);
                  root.addView(note, full());

                  scroll.addView(root);
                  setContentView(scroll);
              }

              private void chooseMusic() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("audio/*");
                  startActivityForResult(i, PICK_AUDIO);
              }

              @Override protected void onActivityResult(int req, int result, Intent data) {
                  super.onActivityResult(req, result, data);
                  if (req != PICK_AUDIO || result != RESULT_OK || data == null || data.getData() == null) return;
                  Uri uri = data.getData();
                  try { getContentResolver().takePersistableUriPermission(uri, data.getFlags() & Intent.FLAG_GRANT_READ_URI_PERMISSION); } catch (Exception ignored) {}
                  load(uri);
              }

              private void load(Uri uri) {
                  releaseAudio();
                  songName.setText(displayName(uri));
                  player = new MediaPlayer();
                  player.setAudioAttributes(new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_MEDIA).setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build());
                  player.setOnPreparedListener(mp -> {
                      attachEq(mp.getAudioSessionId());
                      play.setEnabled(true);
                      play.setText("PLAY");
                      eqStatus.setText(equalizer == null ? "Song ready. This phone did not expose an Equalizer." : "Song ready. RCF EQ bridge is active.");
                  });
                  player.setOnCompletionListener(mp -> { mp.seekTo(0); play.setText("PLAY"); });
                  try {
                      player.setDataSource(this, uri);
                      player.prepareAsync();
                  } catch (IOException | SecurityException e) {
                      Toast.makeText(this, "Unable to open this song", Toast.LENGTH_LONG).show();
                  }
              }

              private void attachEq(int session) {
                  try {
                      equalizer = new Equalizer(0, session);
                      equalizer.setEnabled(true);
                  } catch (RuntimeException e) {
                      equalizer = null;
                  }
              }

              private void togglePlay() {
                  if (player == null) return;
                  if (player.isPlaying()) { player.pause(); play.setText("PLAY"); }
                  else { player.start(); play.setText("PAUSE"); }
              }

              private void startOscServer() {
                  running = true;
                  oscThread = new Thread(() -> {
                      try {
                          DatagramSocket s = new DatagramSocket(null);
                          s.setReuseAddress(true);
                          s.bind(new InetSocketAddress("0.0.0.0", RCF_PORT));
                          oscSocket = s;
                          byte[] buf = new byte[65535];
                          while (running) {
                              DatagramPacket p = new DatagramPacket(buf, buf.length);
                              s.receive(p);
                              parsePacket(p.getData(), p.getOffset(), p.getLength());
                          }
                      } catch (Exception e) {
                          if (running) ui.post(() -> rcfStatus.setText("RCF bridge error: " + e.getMessage()));
                      }
                  }, "RCF-OSC-8000");
                  oscThread.start();
              }

              private void parsePacket(byte[] data, int off, int len) {
                  if (len < 4) return;
                  if (len >= 16 && starts(data, off, "#bundle")) {
                      int pos = off + 16;
                      int end = off + len;
                      while (pos + 4 <= end) {
                          int size = readInt(data, pos); pos += 4;
                          if (size <= 0 || pos + size > end) break;
                          parsePacket(data, pos, size);
                          pos += size;
                      }
                      return;
                  }

                  OscString a = readString(data, off, off + len);
                  if (a == null) return;
                  OscString tags = readString(data, a.next, off + len);
                  if (tags == null || tags.text.length() < 2 || tags.text.charAt(0) != ',') return;
                  int pos = tags.next;
                  for (int i = 1; i < tags.text.length(); i++) {
                      char t = tags.text.charAt(i);
                      if (t == 'f' && pos + 4 <= off + len) {
                          float v = Float.intBitsToFloat(readInt(data, pos)); pos += 4;
                          onOsc(a.text, v);
                          return;
                      } else if (t == 'i' && pos + 4 <= off + len) {
                          int v = readInt(data, pos); pos += 4;
                          onOsc(a.text, v);
                          return;
                      } else if (t == 's') {
                          OscString sv = readString(data, pos, off + len);
                          if (sv == null) return;
                          pos = sv.next;
                      }
                  }
              }

              private void onOsc(String address, float value) {
                  ui.post(() -> {
                      rcfStatus.setText("RCF connected: " + address + "  " + String.format(Locale.US, "%.3f", value));
                      applyRcfEq(address, value);
                  });
              }

              private void applyRcfEq(String address, float value) {
                  if (equalizer == null) return;
                  Matcher m = RCF_EQ.matcher(address);
                  if (!m.matches()) return;
                  String section = m.group(3);
                  int control = Integer.parseInt(m.group(4));

                  try {
                      if ("eq".equals(section) && control == 2) {
                          equalizer.setEnabled(value >= 0.5f);
                          eqStatus.setText(value >= 0.5f ? "RCF EQ ON" : "RCF EQ BYPASSED");
                          return;
                      }

                      int band = -1;
                      if ("eq".equals(section)) {
                          if (control == 3) band = bandForFraction(0.00f);
                          else if (control == 7) band = bandForFraction(0.33f);
                          else if (control == 10) band = bandForFraction(0.66f);
                          else if (control == 13) band = bandForFraction(1.00f);
                          else return;
                      } else if ("gq".equals(section)) {
                          if (control < 1 || control > 31) return;
                          band = bandForFraction((control - 1f) / 30f);
                      }

                      setBandFromRcf(band, value);
                      int hz = equalizer.getCenterFreq((short)band) / 1000;
                      eqStatus.setText("RCF → phone EQ: " + hz + " Hz  " + String.format(Locale.US, "%.2f", value));
                  } catch (RuntimeException ignored) {}
              }

              private int bandForFraction(float f) {
                  int n = Math.max(1, equalizer.getNumberOfBands());
                  return Math.max(0, Math.min(n - 1, Math.round(f * (n - 1))));
              }

              private void setBandFromRcf(int band, float value) {
                  short[] range = equalizer.getBandLevelRange();
                  float bipolar;
                  if (value >= 0f && value <= 1f) bipolar = (value - 0.5f) * 2f;
                  else if (value >= -1f && value <= 1f) bipolar = value;
                  else bipolar = Math.max(-1f, Math.min(1f, value / 20f));

                  int level = bipolar >= 0 ? Math.round(bipolar * range[1]) : Math.round((-bipolar) * range[0]);
                  level = Math.max(range[0], Math.min(range[1], level));
                  equalizer.setBandLevel((short)band, (short)level);
              }

              private static boolean starts(byte[] b, int off, String s) {
                  byte[] x = s.getBytes(StandardCharsets.US_ASCII);
                  if (off + x.length > b.length) return false;
                  for (int i=0;i<x.length;i++) if (b[off+i] != x[i]) return false;
                  return true;
              }

              private static int readInt(byte[] b, int p) {
                  return ByteBuffer.wrap(b, p, 4).order(ByteOrder.BIG_ENDIAN).getInt();
              }

              private static OscString readString(byte[] b, int pos, int end) {
                  int z = pos;
                  while (z < end && b[z] != 0) z++;
                  if (z >= end) return null;
                  String s = new String(b, pos, z - pos, StandardCharsets.UTF_8);
                  int next = (z + 4) & ~3;
                  if (next > end) next = end;
                  return new OscString(s, next);
              }

              private static class OscString {
                  final String text; final int next;
                  OscString(String t, int n) { text=t; next=n; }
              }

              private String displayName(Uri uri) {
                  Cursor c = null;
                  try {
                      c = getContentResolver().query(uri, new String[]{OpenableColumns.DISPLAY_NAME}, null, null, null);
                      if (c != null && c.moveToFirst()) {
                          int i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                          if (i >= 0) return c.getString(i);
                      }
                  } catch (Exception ignored) {} finally { if (c != null) c.close(); }
                  return "Selected song";
              }

              private void releaseAudio() {
                  if (equalizer != null) { try { equalizer.release(); } catch (Exception ignored) {} equalizer = null; }
                  if (player != null) { try { player.release(); } catch (Exception ignored) {} player = null; }
              }

              @Override protected void onDestroy() {
                  running = false;
                  ui.removeCallbacks(progressTick);
                  if (oscSocket != null) oscSocket.close();
                  releaseAudio();
                  super.onDestroy();
              }

              private TextView label(String t, int sp, int color, boolean bold) {
                  TextView v = new TextView(this); v.setText(t); v.setTextSize(sp); v.setTextColor(color);
                  if (bold) v.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  return v;
              }
              private Button button(String t) {
                  Button b = new Button(this); b.setText(t); b.setTextColor(Color.WHITE); b.setTextSize(12); return b;
              }
              private LinearLayout.LayoutParams full() { return new LinearLayout.LayoutParams(-1,-2); }
              private LinearLayout.LayoutParams fullTop(int top) { LinearLayout.LayoutParams p=full();p.setMargins(0,dp(top),0,0);return p; }
              private LinearLayout.LayoutParams weight() { return new LinearLayout.LayoutParams(0,dp(52),1f); }
              private int dp(int n) { return Math.round(n * getResources().getDisplayMetrics().density); }
          }
          EOF

      - name: Build APK
        run: |
          gradle --no-daemon -p "$RUNNER_TEMP/RCFBridgePlayer" :app:assembleDebug
          cp "$RUNNER_TEMP/RCFBridgePlayer/app/build/outputs/apk/debug/app-debug.apk" RCFBridgePlayer.apk
          sha256sum RCFBridgePlayer.apk > RCFBridgePlayer.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RCF-Bridge-Player-APK
          path: |
            RCFBridgePlayer.apk
            RCFBridgePlayer.sha256
