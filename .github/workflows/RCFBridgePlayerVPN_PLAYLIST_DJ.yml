                  String firstString = null;
          
                  for (int i = 1; i < tags.value.length(); i++) {
                      char t = tags.value.charAt(i);
                      if (t == 'f' && pos + 4 <= off + len) {
                          float f = Float.intBitsToFloat(readInt(data, pos));
                          if (firstFloat == null) firstFloat = f;
                          pos += 4;
                      } else if (t == 'i' && pos + 4 <= off + len) {
                          int iv = readInt(data, pos);
                          if (firstFloat == null) firstFloat = (float)iv;
                          pos += 4;
                      } else if (t == 'd' && pos + 8 <= off + len) {
                          double dv = ByteBuffer.wrap(data, pos, 8).order(ByteOrder.BIG_ENDIAN).getDouble();
                          if (firstFloat == null) firstFloat = (float)dv;
                          pos += 8;
                      } else if (t == 'h' && pos + 8 <= off + len) {
                          long lv = ByteBuffer.wrap(data, pos, 8).order(ByteOrder.BIG_ENDIAN).getLong();
                          if (firstFloat == null) firstFloat = (float)lv;
                          pos += 8;
                      } else if (t == 's') {
                          OscString s = readOscString(data, pos, off + len);
                          if (s == null) return;
                          if (firstString == null) firstString = s.value;
                          pos = s.next;
                      } else if (t == 'T') {
                          if (firstFloat == null) firstFloat = 1f;
                      } else if (t == 'F') {
                          if (firstFloat == null) firstFloat = 0f;
                      } else if (t == 'b' && pos + 4 <= off + len) {
                          int n = readInt(data, pos); pos += 4;
                          if (n < 0 || pos + n > off + len) return;
                          pos = (pos + n + 3) & ~3;
                      } else {
                          // Unknown OSC atom: keep the packet visible in the raw log rather than crashing the bridge.
                          break;
                      }
                  }
                  out.add(new OscMessage(address.value, firstFloat, firstString));
              }
          
              private byte[] buildUdpIpv4(byte[] src, byte[] dst, int srcPort, int dstPort, byte[] payload) {
                  int total = 20 + 8 + payload.length;
                  byte[] p = new byte[total];
                  p[0] = 0x45;
                  p[1] = 0;
                  put16(p, 2, total);
                  put16(p, 4, packetId++ & 0xFFFF);
                  put16(p, 6, 0);
                  p[8] = 64;
                  p[9] = 17;
                  System.arraycopy(src, 0, p, 12, 4);
                  System.arraycopy(dst, 0, p, 16, 4);
                  put16(p, 20, srcPort);
                  put16(p, 22, dstPort);
                  put16(p, 24, 8 + payload.length);
                  put16(p, 26, 0); // IPv4 UDP checksum optional.
                  System.arraycopy(payload, 0, p, 28, payload.length);
                  put16(p, 10, ipChecksum(p, 0, 20));
                  return p;
              }
          
              private int ipChecksum(byte[] b, int off, int len) {
                  long sum = 0;
                  for (int i = off; i < off + len; i += 2) {
                      int word = (b[i] & 0xFF) << 8;
                      if (i + 1 < off + len) word |= b[i + 1] & 0xFF;
                      sum += word;
                      while ((sum & 0xFFFF0000L) != 0) sum = (sum & 0xFFFFL) + (sum >>> 16);
                  }
                  return (int)(~sum) & 0xFFFF;
              }
          
              @Override public void onDestroy() {
