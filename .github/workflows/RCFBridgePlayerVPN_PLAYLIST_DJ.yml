                  long until = System.currentTimeMillis() + maxMs;
                  Float x;
                  while ((x = bpmCache.get(k)) == null && System.currentTimeMillis() < until) {
                      try { Thread.sleep(40L); } catch (InterruptedException e) { break; }
                  }
                  return x == null ? 0f : x;
              }
          
              private synchronized float tempoFor(float bpm) {
                  if (bpm <= 0f) return 1f;
                  if (masterBpm <= 0f) {
                      masterBpm = bpm;
                      return 1f;
                  }
                  float adjusted = bpm;
                  while (adjusted < masterBpm * 0.67f) adjusted *= 2f;
                  while (adjusted > masterBpm * 1.50f) adjusted *= 0.5f;
                  float speed = masterBpm / adjusted;
                  return Math.max(0.90f, Math.min(1.10f, speed));
              }
          
              private void decodeLoop(int myGeneration, Uri localUri) {
                  MediaExtractor extractor = new MediaExtractor();
                  MediaCodec decoder = null;
                  AudioTrack track = null;
                  boolean completed = false;
                  float bpm = waitForBpm(localUri, 1200L);
                  float speed = tempoFor(bpm);
                  try {
                      if (localUri == null || myGeneration != generation) return;
                      extractor.setDataSource(context, localUri, null);
                      int audioTrackIndex = -1;
                      MediaFormat inputFormat = null;
                      String mime = null;
                      for (int i = 0; i < extractor.getTrackCount(); i++) {
                          MediaFormat f = extractor.getTrackFormat(i);
                          String m = f.getString(MediaFormat.KEY_MIME);
                          if (m != null && m.startsWith("audio/")) {
                              audioTrackIndex = i; inputFormat = f; mime = m; break;
                          }
                      }
                      if (audioTrackIndex < 0 || inputFormat == null || mime == null) {
                          notifyStatus("No playable audio track found.");
                          return;
                      }
                      long durationUs = inputFormat.containsKey(MediaFormat.KEY_DURATION) ? inputFormat.getLong(MediaFormat.KEY_DURATION) : 0L;
                      extractor.selectTrack(audioTrackIndex);
                      try { inputFormat.setInteger(MediaFormat.KEY_PCM_ENCODING, AudioFormat.ENCODING_PCM_16BIT); } catch (Exception ignored) {}
                      decoder = MediaCodec.createDecoderByType(mime);
                      decoder.configure(inputFormat, null, null, 0);
                      decoder.start();
          
                      int sampleRate = inputFormat.containsKey(MediaFormat.KEY_SAMPLE_RATE) ? inputFormat.getInteger(MediaFormat.KEY_SAMPLE_RATE) : 44100;
                      int channelCount = inputFormat.containsKey(MediaFormat.KEY_CHANNEL_COUNT) ? inputFormat.getInteger(MediaFormat.KEY_CHANNEL_COUNT) : 2;
                      channelCount = Math.max(1, Math.min(2, channelCount));
                      dsp.configure(sampleRate, channelCount);
                      dsp.reset();
                      track = buildTrack(sampleRate, channelCount);
                      applyTempo(track, speed);
                      synchronized (this) { audioTrack = track; }
                      if (playing) track.play();
          
                      String dj = bpm > 0f ? String.format(Locale.US, " • %.0f BPM • tempo %.3fx", bpm, speed) : " • BPM analyzing";
                      notifyStatus("Playing — RCF DSP + AUTO DJ" + dj);
          
                      MediaCodec.BufferInfo info = new MediaCodec.BufferInfo();
                      boolean inputDone = false;
                      boolean outputDone = false;
                      int outputEncoding = AudioFormat.ENCODING_PCM_16BIT;
                      final long TIMEOUT_US = 10000L;
          
                      while (myGeneration == generation && !outputDone) {
                          if (!playing) {
                              try { Thread.sleep(20L); } catch (InterruptedException ignored) {}
                              continue;
                          }
                          if (!inputDone) {
                              int inIndex = decoder.dequeueInputBuffer(TIMEOUT_US);
                              if (inIndex >= 0) {
                                  ByteBuffer inBuf = decoder.getInputBuffer(inIndex);
                                  if (inBuf != null) {
                                      inBuf.clear();
                                      int size = extractor.readSampleData(inBuf, 0);
                                      if (size < 0) {
                                          decoder.queueInputBuffer(inIndex, 0, 0, 0L, MediaCodec.BUFFER_FLAG_END_OF_STREAM);
                                          inputDone = true;
                                      } else {
                                          long pts = Math.max(0L, extractor.getSampleTime());
                                          decoder.queueInputBuffer(inIndex, 0, size, pts, 0);
                                          extractor.advance();
                                      }
                                  }
                              }
                          }
                          int outIndex = decoder.dequeueOutputBuffer(info, TIMEOUT_US);
                          if (outIndex == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                              MediaFormat outFormat = decoder.getOutputFormat();
                              int newRate = outFormat.containsKey(MediaFormat.KEY_SAMPLE_RATE) ? outFormat.getInteger(MediaFormat.KEY_SAMPLE_RATE) : sampleRate;
                              int newChannels = outFormat.containsKey(MediaFormat.KEY_CHANNEL_COUNT) ? outFormat.getInteger(MediaFormat.KEY_CHANNEL_COUNT) : channelCount;
                              newChannels = Math.max(1, Math.min(2, newChannels));
                              if (outFormat.containsKey(MediaFormat.KEY_PCM_ENCODING)) try { outputEncoding = outFormat.getInteger(MediaFormat.KEY_PCM_ENCODING); } catch (Exception ignored) {}
                              if (newRate != sampleRate || newChannels != channelCount) {
                                  sampleRate = newRate; channelCount = newChannels;
                                  dsp.configure(sampleRate, channelCount);
                                  try { track.pause(); track.flush(); track.release(); } catch (Exception ignored) {}
                                  track = buildTrack(sampleRate, channelCount);
                                  applyTempo(track, speed);
                                  synchronized (this) { audioTrack = track; }
                                  if (playing) track.play();
                              }
                          } else if (outIndex >= 0) {
                              ByteBuffer outBuf = decoder.getOutputBuffer(outIndex);
                              if (outBuf != null && info.size > 0) {
                                  outBuf.position(info.offset); outBuf.limit(info.offset + info.size);
                                  ByteBuffer slice = outBuf.slice().order(ByteOrder.nativeOrder());
                                  short[] pcm;
                                  if (outputEncoding == AudioFormat.ENCODING_PCM_FLOAT) {
                                      FloatBuffer fb = slice.asFloatBuffer();
                                      pcm = new short[fb.remaining()];
                                      for (int i = 0; i < pcm.length; i++) {
                                          float x = Math.max(-1f, Math.min(1f, fb.get()));
                                          pcm[i] = (short)Math.round(x * 32767f);
                                      }
                                  } else {
                                      ShortBuffer sb = slice.asShortBuffer();
                                      pcm = new short[sb.remaining()]; sb.get(pcm);
                                  }
                                  if (pcm.length > 0) {
                                      applyDjFade(pcm, channelCount, info.presentationTimeUs, durationUs);
                                      dsp.process(pcm, pcm.length, channelCount);
                                      int written = 0;
                                      while (written < pcm.length && myGeneration == generation) {
                                          int n = track.write(pcm, written, pcm.length - written, AudioTrack.WRITE_BLOCKING);
                                          if (n <= 0) break; written += n;
                                      }
                                  }
                              }
                              outputDone = (info.flags & MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0;
                              decoder.releaseOutputBuffer(outIndex, false);
                          }
                      }
                      completed = myGeneration == generation && outputDone;
                  } catch (Exception e) {
                      playing = false;
                      notifyStatus("Audio error: " + safe(e.getMessage()));
                  } finally {
                      try { extractor.release(); } catch (Exception ignored) {}
                      if (decoder != null) { try { decoder.stop(); } catch (Exception ignored) {} try { decoder.release(); } catch (Exception ignored) {} }
                      if (track != null) { try { track.pause(); } catch (Exception ignored) {} try { track.flush(); } catch (Exception ignored) {} try { track.release(); } catch (Exception ignored) {} }
                      synchronized (this) {
                          if (audioTrack == track) audioTrack = null;
                          if (worker == Thread.currentThread()) worker = null;
                      }
                      if (completed) autoAdvance(myGeneration);
                  }
              }
          
              private synchronized void autoAdvance(int finishedGeneration) {
                  if (finishedGeneration != generation || playlist.isEmpty()) return;
                  currentIndex = (currentIndex + 1) % playlist.size();
                  uri = playlist.get(currentIndex);
                  ready = true;
                  playing = true;
                  startCurrentWorkerLocked();
                  notifyStatus("AUTO DJ → next song");
              }
          
              private static void applyTempo(AudioTrack track, float speed) {
                  try {
                      PlaybackParams p = new PlaybackParams();
                      p.allowDefaults();
                      p.setSpeed(speed);
                      p.setPitch(1.0f);
                      track.setPlaybackParams(p);
                  } catch (Exception ignored) {}
              }
          
              private static void applyDjFade(short[] pcm, int channels, long ptsUs, long durationUs) {
                  if (durationUs <= 0L || pcm == null || pcm.length == 0) return;
                  float gain = 1f;
                  final long fadeIn = 1200000L;
                  final long fadeOut = 3500000L;
                  if (ptsUs < fadeIn) gain = Math.max(0.15f, ptsUs / (float)fadeIn);
                  long remain = durationUs - ptsUs;
                  if (remain < fadeOut) gain = Math.min(gain, Math.max(0.08f, remain / (float)fadeOut));
                  if (gain >= 0.999f) return;
                  for (int i = 0; i < pcm.length; i++) pcm[i] = (short)Math.round(pcm[i] * gain);
              }
          
              private float estimateBpm(Uri target) {
                  MediaExtractor ex = new MediaExtractor();
                  MediaCodec dec = null;
                  try {
                      ex.setDataSource(context, target, null);
                      int ix = -1; MediaFormat fmt = null; String mime = null;
                      for (int i=0;i<ex.getTrackCount();i++) {
                          MediaFormat f=ex.getTrackFormat(i); String m=f.getString(MediaFormat.KEY_MIME);
                          if (m!=null && m.startsWith("audio/")) { ix=i; fmt=f; mime=m; break; }
                      }
                      if (ix<0 || fmt==null || mime==null) return 0f;
                      ex.selectTrack(ix);
                      int rate = fmt.containsKey(MediaFormat.KEY_SAMPLE_RATE) ? fmt.getInteger(MediaFormat.KEY_SAMPLE_RATE) : 44100;
                      int ch = fmt.containsKey(MediaFormat.KEY_CHANNEL_COUNT) ? Math.max(1, Math.min(2, fmt.getInteger(MediaFormat.KEY_CHANNEL_COUNT))) : 2;
                      try { fmt.setInteger(MediaFormat.KEY_PCM_ENCODING, AudioFormat.ENCODING_PCM_16BIT); } catch(Exception ignored){}
                      dec=MediaCodec.createDecoderByType(mime); dec.configure(fmt,null,null,0); dec.start();
                      ArrayList<Float> env=new ArrayList<>();
                      int framesPerBin=Math.max(64, rate/100); int frames=0; double sum=0;
                      boolean inDone=false,outDone=false; int enc=AudioFormat.ENCODING_PCM_16BIT; MediaCodec.BufferInfo info=new MediaCodec.BufferInfo();
                      while(!outDone && env.size()<1400) {
                          if(!inDone) {
                              int ii=dec.dequeueInputBuffer(5000); if(ii>=0) { ByteBuffer b=dec.getInputBuffer(ii); if(b!=null){b.clear();int sz=ex.readSampleData(b,0); if(sz<0){dec.queueInputBuffer(ii,0,0,0,MediaCodec.BUFFER_FLAG_END_OF_STREAM);inDone=true;} else {long pts=Math.max(0,ex.getSampleTime());dec.queueInputBuffer(ii,0,sz,pts,0);ex.advance();}} }
                          }
                          int oi=dec.dequeueOutputBuffer(info,5000);
                          if(oi==MediaCodec.INFO_OUTPUT_FORMAT_CHANGED){ MediaFormat of=dec.getOutputFormat(); if(of.containsKey(MediaFormat.KEY_PCM_ENCODING)) try{enc=of.getInteger(MediaFormat.KEY_PCM_ENCODING);}catch(Exception ignored){} }
                          else if(oi>=0){ ByteBuffer ob=dec.getOutputBuffer(oi); if(ob!=null && info.size>0){ob.position(info.offset);ob.limit(info.offset+info.size);ByteBuffer sl=ob.slice().order(ByteOrder.nativeOrder());
                              if(enc==AudioFormat.ENCODING_PCM_FLOAT){FloatBuffer fb=sl.asFloatBuffer();int c=0;while(fb.hasRemaining()){sum+=Math.abs(fb.get());c++;if(c%ch==0){frames++;if(frames>=framesPerBin){env.add((float)(sum/(framesPerBin*ch)));sum=0;frames=0;}}}}
                              else {ShortBuffer sb=sl.asShortBuffer();int c=0;while(sb.hasRemaining()){sum+=Math.abs((int)sb.get())/32768.0;c++;if(c%ch==0){frames++;if(frames>=framesPerBin){env.add((float)(sum/(framesPerBin*ch)));sum=0;frames=0;}}}}
                          } outDone=(info.flags&MediaCodec.BUFFER_FLAG_END_OF_STREAM)!=0;dec.releaseOutputBuffer(oi,false); }
                      }
                      if(env.size()<400) return 0f;
                      float[] onset=new float[env.size()];
                      for(int i=4;i<env.size();i++){float base=(env.get(i-1)+env.get(i-2)+env.get(i-3)+env.get(i-4))*0.25f; onset[i]=Math.max(0f,env.get(i)-base);}
                      int best=0; double bestScore=-1;
                      for(int bpm=70;bpm<=180;bpm++){int lag=Math.max(1,Math.round(6000f/bpm));double score=0,a=0,b=0;for(int i=lag;i<onset.length;i++){double x=onset[i],y=onset[i-lag];score+=x*y;a+=x*x;b+=y*y;}score/=Math.sqrt(a*b+1e-12);if(score>bestScore){bestScore=score;best=bpm;}}
                      return bestScore>0.05 ? best : 0f;
                  } catch(Exception e){ return 0f; }
                  finally { try{ex.release();}catch(Exception ignored){} if(dec!=null){try{dec.stop();}catch(Exception ignored){}try{dec.release();}catch(Exception ignored){}} }
              }
          
              private static AudioTrack buildTrack(int sampleRate, int channelCount) {
                  int channelMask = channelCount == 1 ? AudioFormat.CHANNEL_OUT_MONO : AudioFormat.CHANNEL_OUT_STEREO;
                  int min = AudioTrack.getMinBufferSize(sampleRate, channelMask, AudioFormat.ENCODING_PCM_16BIT);
                  if (min < 0) min = sampleRate * channelCount * 2 / 5;
                  int buffer = Math.max(min * 3, sampleRate * channelCount * 2 / 4);
                  return new AudioTrack.Builder()
                          .setAudioAttributes(new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_MEDIA).setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build())
                          .setAudioFormat(new AudioFormat.Builder().setEncoding(AudioFormat.ENCODING_PCM_16BIT).setSampleRate(sampleRate).setChannelMask(channelMask).build())
                          .setTransferMode(AudioTrack.MODE_STREAM).setBufferSizeInBytes(buffer).build();
              }
          
              private void notifyStatus(String text) {
                  if (listener != null) listener.onStatus(text, playing, trackText());
              }
          
              private String trackText() {
                  if (uri == null) return playlist.isEmpty() ? "No playlist selected" : playlist.size() + " songs";
                  String n = displayName(uri);
                  return playlist.size() > 1 ? (currentIndex + 1) + "/" + playlist.size() + "  " + n : n;
              }
          
              private String displayName(Uri u) {
                  Cursor c=null;
                  try { c=context.getContentResolver().query(u,new String[]{OpenableColumns.DISPLAY_NAME},null,null,null); if(c!=null && c.moveToFirst()){int i=c.getColumnIndex(OpenableColumns.DISPLAY_NAME); if(i>=0){String n=c.getString(i);if(n!=null&&!n.isEmpty())return n;}} } catch(Exception ignored){} finally {if(c!=null)c.close();}
                  return "Selected song";
              }
          
              private static String safe(String s) { return s == null ? "unknown" : s; }
          }
          JAVA

      - name: Pure Java DSP smoke test
        shell: bash
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/RCFBridgePlayer"
          T="$RUNNER_TEMP/dsp-smoke"
          mkdir -p "$T/out"
          cat > "$T/DspSmoke.java" <<'EOF'
          import com.rcfbridge.player.DspEngine;
          public class DspSmoke {
              private static void need(boolean ok, String msg) { if (!ok) throw new RuntimeException(msg); }
              public static void main(String[] args) {
                  DspEngine d = new DspEngine();
                  d.configure(48000, 2);
                  need(d.handleOsc("/00/00/gq_001", 1f).contains("20.0 Hz"), "GEQ low band mapping failed");
                  need(d.handleOsc("/00/00/gq_031", 1f).contains("20000.0 Hz"), "GEQ high band mapping failed");
                  need(d.handleOsc("/00/00/tw_000", 1f) != null, "Valve mapping failed");
                  need(d.handleOsc("/00/00/ex_000", 1f) != null, "Xciter mapping failed");
                  need(d.handleOsc("/00/00/mx_000", 1f) != null, "Maximizer mapping failed");
                  need(d.handleOsc("/11/00/fx_000", 1f) != null, "Reverb mapping failed");
                  need(d.handleOsc("/11/01/fx_000", 1f) != null, "Delay mapping failed");
                  need(d.handleOsc("/28/04/fx_000", 1f) != null, "MFX overdrive mapping failed");
                  need(d.handleOsc("/28/05/fx_013", 0.5f) != null, "MFX amp model mapping failed");
                  need(d.handleOsc("/13/00/fd_000", 0.75f) != null, "Phones fader mapping failed");
                  need(d.handleOsc("/22/00/gb_079", 1f) != null, "PFL mapping failed");
                  short[] pcm = new short[9600];
                  for (int i=0;i<pcm.length;i+=2) { short x=(short)(Math.sin(i*0.03)*10000); pcm[i]=x; pcm[i+1]=x; }
                  d.process(pcm, pcm.length, 2);
                  System.out.println("FULL DSP smoke test OK");
              }
          }
          EOF
          javac -d "$T/out" "$P/app/src/main/java/com/rcfbridge/player/DspEngine.java" "$T/DspSmoke.java"
          java -cp "$T/out" DspSmoke

      - name: Build installable APK
        shell: bash
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/RCFBridgePlayer"
          gradle --no-daemon --stacktrace -p "$P" :app:assembleDebug
          cp "$P/app/build/outputs/apk/debug/app-debug.apk" RCFBridgePlayer-PLAYLIST-AUTODJ-Android12-13.apk
          sha256sum RCFBridgePlayer-PLAYLIST-AUTODJ-Android12-13.apk > RCFBridgePlayer-PLAYLIST-AUTODJ-Android12-13.sha256

      - name: Verify APK package and SDK
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging RCFBridgePlayer-PLAYLIST-AUTODJ-Android12-13.apk | tee apk-badging.txt
          grep -q "package: name='com.rcfbridge.player'" apk-badging.txt
          grep -q "targetSdkVersion:'33'" apk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs RCFBridgePlayer-PLAYLIST-AUTODJ-Android12-13.apk | tee apk-signature.txt

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: RCF-Bridge-Player-PLAYLIST-AUTODJ-Android12-13
          path: |
            RCFBridgePlayer-PLAYLIST-AUTODJ-Android12-13.apk
            RCFBridgePlayer-PLAYLIST-AUTODJ-Android12-13.sha256
            apk-badging.txt
            apk-signature.txt
          if-no-files-found: error
