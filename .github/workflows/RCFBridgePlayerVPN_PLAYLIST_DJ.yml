name: Build RCF Phone FULL DSP Bridge APK - PLAYLIST AUTO DJ v6

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/RCFBridgePlayerVPN_PLAYLIST_DJ.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Create full RCF phone DSP project
        shell: bash
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/RCFBridgePlayer"
          mkdir -p "$P/app/src/main/java/com/rcfbridge/player"

          cat > "$P/settings.gradle" <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "RCFBridgePlayer"
          include ":app"
          EOF

          cat > "$P/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.10.1' apply false
          }
          EOF

          cat > "$P/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > "$P/app/build.gradle" <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.rcfbridge.player'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.rcfbridge.player'
                  minSdk 23
                  targetSdk 33
                  versionCode 6
                  versionName '6.0-playlist-auto-dj'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > "$P/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:label="RCF Phone DSP Bridge"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".BridgeVpnService"
                      android:exported="false"
                      android:permission="android.permission.BIND_VPN_SERVICE"
                      android:foregroundServiceType="mediaPlayback">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat > "$P/app/src/main/java/com/rcfbridge/player/MainActivity.java" <<'JAVA'
          package com.rcfbridge.player;
          
          import android.app.Activity;
          import android.content.Intent;
          import android.content.ClipData;
          import android.database.Cursor;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.net.Uri;
          import android.net.VpnService;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.OpenableColumns;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          
          import java.util.ArrayList;
          
          public class MainActivity extends Activity {
              private static final int PICK_AUDIO = 7001;
              private static final int PREPARE_VPN = 7002;
          
              private final Handler handler = new Handler(Looper.getMainLooper());
              private TextView track;
              private TextView vpnStatus;
              private TextView oscStatus;
              private TextView audioStatus;
              private TextView logStatus;
              private Button playButton;
          
              private final Runnable statusTick = new Runnable() {
                  @Override public void run() {
                      vpnStatus.setText(BridgeVpnService.vpnStatus);
                      oscStatus.setText(BridgeVpnService.oscStatus);
                      audioStatus.setText(BridgeVpnService.audioStatus);
                      track.setText(BridgeVpnService.trackStatus);
                      logStatus.setText(BridgeVpnService.recentOscLog);
                      playButton.setText(BridgeVpnService.isPlaying ? "PAUSE" : "PLAY");
                      handler.postDelayed(this, 250L);
                  }
              };
          
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  buildUi();
                  handler.post(statusTick);
              }
          
              private void buildUi() {
                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);
                  scroll.setBackgroundColor(Color.rgb(7, 11, 16));
          
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(18), dp(16), dp(18), dp(28));
          
                  TextView title = text("RCF PHONE DSP BRIDGE", 22, Color.WHITE, true);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title, full());
          
                  TextView sub = text("ORIGINAL MIXREMOTE • FULL DSP • PLAYLIST • AUTO DJ BPM MATCH", 11, Color.rgb(39,164,220), true);
                  sub.setGravity(Gravity.CENTER);
                  sub.setPadding(0, dp(4), 0, dp(14));
                  root.addView(sub, full());
          
                  Button bridge = button("START RCF BRIDGE");
                  bridge.setOnClickListener(v -> prepareVpn());
                  root.addView(bridge, height(52));
          
                  vpnStatus = status("Bridge stopped");
                  root.addView(vpnStatus, fullTop(8));
          
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  Button choose = button("SELECT PLAYLIST");
                  choose.setOnClickListener(v -> chooseMusic());
                  row.addView(choose, weight());
                  playButton = button("PLAY");
                  playButton.setOnClickListener(v -> sendService(BridgeVpnService.ACTION_TOGGLE, null));
                  LinearLayout.LayoutParams wp = weight(); wp.setMargins(dp(8), 0, 0, 0);
                  row.addView(playButton, wp);
                  root.addView(row, fullTop(14));
          
                  track = text("No music selected", 15, Color.WHITE, true);
                  track.setGravity(Gravity.CENTER);
                  track.setPadding(dp(6), dp(10), dp(6), dp(8));
                  root.addView(track, full());
          
                  root.addView(heading("RCF CONTROL — LAST REAL CONTROL"), fullTop(8));
                  oscStatus = status("Waiting for MixRemote controls…");
                  root.addView(oscStatus, full());
          
                  root.addView(heading("PHONE AUDIO"), fullTop(8));
                  audioStatus = status("Select a song.");
                  root.addView(audioStatus, full());
          
                  root.addView(heading("RECENT COMMANDS — POLLING FILTERED OUT"), fullTop(8));
                  logStatus = status("No control commands yet.");
                  logStatus.setGravity(Gravity.LEFT);
                  logStatus.setTypeface(Typeface.MONOSPACE);
                  root.addView(logStatus, full());
          
                  TextView instructions = text(
                          "1) START RCF BRIDGE.  2) SELECT PLAYLIST and choose several songs.  3) PLAY. Songs continue automatically. AUTO DJ estimates BPM and tempo-matches each next song while preserving pitch.  4) MixRemote DSP remains active for GEQ, Valve Warmer, Xciter, Maximizer, Send FX, Multi FX, faders and Phones.",
                          12, Color.LTGRAY, false);
                  instructions.setPadding(dp(4), dp(18), dp(4), 0);
                  root.addView(instructions, full());
          
                  scroll.addView(root);
                  setContentView(scroll);
              }
          
              private TextView heading(String s) {
                  TextView t = text(s, 12, Color.rgb(39,164,220), true);
                  t.setPadding(0, dp(10), 0, dp(5));
                  return t;
              }
          
              private void prepareVpn() {
                  Intent permission = VpnService.prepare(this);
                  if (permission != null) startActivityForResult(permission, PREPARE_VPN);
                  else startBridge();
              }
          
              private void startBridge() {
                  Intent i = new Intent(this, BridgeVpnService.class);
                  i.setAction(BridgeVpnService.ACTION_START);
                  if (Build.VERSION.SDK_INT >= 26) startForegroundService(i); else startService(i);
              }
          
              private void chooseMusic() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("audio/*");
                  i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                  startActivityForResult(i, PICK_AUDIO);
              }
          
              @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == PREPARE_VPN) {
                      if (resultCode == RESULT_OK) startBridge();
                      else Toast.makeText(this, "VPN permission is needed for the original RCF app.", Toast.LENGTH_LONG).show();
                      return;
                  }
                  if (requestCode != PICK_AUDIO || resultCode != RESULT_OK || data == null) return;
                  ArrayList<Uri> list = new ArrayList<>();
                  ClipData clips = data.getClipData();
                  if (clips != null) {
                      for (int n = 0; n < clips.getItemCount(); n++) {
                          Uri uri = clips.getItemAt(n).getUri();
                          if (uri != null) list.add(uri);
                      }
                  } else if (data.getData() != null) {
                      list.add(data.getData());
                  }
                  if (list.isEmpty()) return;
                  for (Uri uri : list) {
                      try {
                          int flags = data.getFlags() & Intent.FLAG_GRANT_READ_URI_PERMISSION;
                          getContentResolver().takePersistableUriPermission(uri, flags);
                      } catch (Exception ignored) {}
                  }
                  track.setText(list.size() + " songs selected — Auto DJ ready");
                  Intent svc = new Intent(this, BridgeVpnService.class);
                  svc.setAction(BridgeVpnService.ACTION_LOAD_PLAYLIST);
                  svc.putParcelableArrayListExtra(BridgeVpnService.EXTRA_PLAYLIST, list);
                  if (Build.VERSION.SDK_INT >= 26) startForegroundService(svc); else startService(svc);
              }
          
              private void sendService(String action, Uri uri) {
                  Intent i = new Intent(this, BridgeVpnService.class);
                  i.setAction(action);
                  if (uri != null) i.setData(uri);
                  if (Build.VERSION.SDK_INT >= 26) startForegroundService(i); else startService(i);
              }
          
              private String displayName(Uri uri) {
                  Cursor c = null;
                  try {
                      c = getContentResolver().query(uri, new String[]{OpenableColumns.DISPLAY_NAME}, null, null, null);
                      if (c != null && c.moveToFirst()) {
                          int index = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                          if (index >= 0) {
                              String n = c.getString(index);
                              if (n != null && !n.isEmpty()) return n;
                          }
                      }
                  } catch (Exception ignored) {
                  } finally {
                      if (c != null) c.close();
                  }
                  return "Selected music";
              }
          
              @Override protected void onDestroy() {
                  handler.removeCallbacks(statusTick);
                  super.onDestroy();
              }
          
              private TextView status(String s) {
                  TextView v = text(s, 13, Color.LTGRAY, false);
                  v.setGravity(Gravity.CENTER);
                  v.setPadding(dp(10), dp(9), dp(10), dp(9));
                  v.setBackgroundColor(Color.rgb(22, 29, 37));
                  return v;
              }
          
              private TextView text(String s, int size, int color, boolean bold) {
                  TextView v = new TextView(this);
                  v.setText(s);
                  v.setTextSize(size);
                  v.setTextColor(color);
                  if (bold) v.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  return v;
              }
          
              private Button button(String s) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setTextColor(Color.WHITE);
                  b.setTextSize(13);
                  b.setAllCaps(false);
                  return b;
              }
          
              private LinearLayout.LayoutParams full() { return new LinearLayout.LayoutParams(-1, -2); }
              private LinearLayout.LayoutParams fullTop(int top) { LinearLayout.LayoutParams p = full(); p.setMargins(0, dp(top), 0, 0); return p; }
              private LinearLayout.LayoutParams height(int h) { return new LinearLayout.LayoutParams(-1, dp(h)); }
              private LinearLayout.LayoutParams weight() { return new LinearLayout.LayoutParams(0, dp(52), 1f); }
              private int dp(int n) { return Math.round(n * getResources().getDisplayMetrics().density); }
          }
          JAVA

          cat > "$P/app/src/main/java/com/rcfbridge/player/BridgeVpnService.java" <<'JAVA'
          package com.rcfbridge.player;
          
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.net.Uri;
          import android.net.VpnService;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.ParcelFileDescriptor;
          
          import java.io.ByteArrayOutputStream;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.nio.ByteBuffer;
          import java.nio.ByteOrder;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayDeque;
          import java.util.ArrayList;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          
          public class BridgeVpnService extends VpnService {
              public static final String ACTION_START = "com.rcfbridge.player.START";
              public static final String ACTION_LOAD = "com.rcfbridge.player.LOAD";
              public static final String ACTION_LOAD_PLAYLIST = "com.rcfbridge.player.LOAD_PLAYLIST";
              public static final String EXTRA_PLAYLIST = "com.rcfbridge.player.PLAYLIST";
              public static final String ACTION_TOGGLE = "com.rcfbridge.player.TOGGLE";
          
              public static volatile String vpnStatus = "Bridge stopped";
              public static volatile String oscStatus = "Waiting for MixRemote controls…";
              public static volatile String audioStatus = "Select a playlist.";
              public static volatile String trackStatus = "No playlist selected";
              public static volatile String recentOscLog = "No control commands yet.";
              public static volatile boolean isPlaying = false;
          
              private static final int NOTIFICATION_ID = 80;
              private static final String CHANNEL_ID = "rcf_bridge_full_dsp";
              private static final ArrayDeque<String> RECENT = new ArrayDeque<>();
          
              private ParcelFileDescriptor tun;
              private Thread packetThread;
              private volatile boolean running;
              private int packetId = 1;
          
              private DspEngine dsp;
              private PhoneAudioEngine audioEngine;
              private final Map<String, Float> state = new LinkedHashMap<>();
          
              @Override public void onCreate() {
                  super.onCreate();
                  dsp = new DspEngine();
                  audioEngine = new PhoneAudioEngine(this, dsp, (text, playing, trackText) -> {
                      audioStatus = text;
                      isPlaying = playing;
                      trackStatus = trackText;
                  });
                  initDefaultState();
              }
          
              @Override public IBinder onBind(Intent intent) { return super.onBind(intent); }
          
              @Override public int onStartCommand(Intent intent, int flags, int startId) {
                  startForegroundNow();
                  if (intent == null) return START_STICKY;
                  String action = intent.getAction();
                  if (ACTION_START.equals(action)) {
                      startVpn();
                  } else if (ACTION_LOAD.equals(action) && intent.getData() != null) {
                      Uri uri = intent.getData();
                      audioEngine.load(uri);
                  } else if (ACTION_LOAD_PLAYLIST.equals(action)) {
                      ArrayList<Uri> list = intent.getParcelableArrayListExtra(EXTRA_PLAYLIST);
                      audioEngine.loadPlaylist(list);
                  } else if (ACTION_TOGGLE.equals(action)) {
                      audioEngine.toggle();
                      isPlaying = audioEngine.isPlaying();
                  }
                  return START_STICKY;
              }
          
              private void startForegroundNow() {
                  NotificationManager nm = (NotificationManager)getSystemService(NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel(CHANNEL_ID, "RCF DSP Bridge", NotificationManager.IMPORTANCE_LOW);
                      nm.createNotificationChannel(ch);
                  }
                  Intent open = new Intent(this, MainActivity.class);
                  int piFlags = PendingIntent.FLAG_UPDATE_CURRENT;
                  if (Build.VERSION.SDK_INT >= 23) piFlags |= PendingIntent.FLAG_IMMUTABLE;
                  PendingIntent pi = PendingIntent.getActivity(this, 0, open, piFlags);
                  Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, CHANNEL_ID) : new Notification.Builder(this);
                  b.setSmallIcon(android.R.drawable.ic_media_play)
                          .setContentTitle("RCF Phone DSP Bridge")
                          .setContentText("MixRemote controls phone audio DSP")
                          .setContentIntent(pi)
                          .setOngoing(true);
                  startForeground(NOTIFICATION_ID, b.build());
              }
          
              private synchronized void startVpn() {
                  if (tun != null) {
                      vpnStatus = "RCF bridge ACTIVE — full OSC capture + DSP";
                      return;
                  }
                  try {
                      Builder b = new Builder()
                              .setSession("RCF M18 Phone DSP Bridge")
                              .setMtu(1500)
                              .addAddress("10.77.0.1", 32)
                              .addRoute("0.0.0.0", 0);
          
                      try {
                          b.addAllowedApplication("com.rcf.mixremote");
                      } catch (android.content.pm.PackageManager.NameNotFoundException e) {
                          vpnStatus = "Install the ORIGINAL RCF MixRemote first, then START RCF BRIDGE.";
                          return;
                      }
          
                      if (Build.VERSION.SDK_INT >= 21) b.setBlocking(true);
                      tun = b.establish();
                      if (tun == null) {
                          vpnStatus = "Bridge could not start — VPN permission missing";
                          return;
                      }
                      running = true;
                      packetThread = new Thread(this::packetLoop, "RCF-VPN-PACKET");
                      packetThread.start();
                      vpnStatus = "RCF bridge ACTIVE — open original MixRemote";
                  } catch (Exception e) {
                      vpnStatus = "Bridge error: " + safe(e.getMessage());
                  }
              }
          
              private void packetLoop() {
                  try (FileInputStream in = new FileInputStream(tun.getFileDescriptor());
                       FileOutputStream out = new FileOutputStream(tun.getFileDescriptor())) {
                      byte[] buf = new byte[32767];
                      while (running) {
                          int n = in.read(buf);
                          if (n <= 0) continue;
                          handleIpPacket(buf, n, out);
                      }
                  } catch (Exception e) {
                      if (running) vpnStatus = "Bridge packet error: " + safe(e.getMessage());
                  }
              }
          
              private void handleIpPacket(byte[] packet, int len, FileOutputStream out) throws IOException {
                  if (len < 28) return;
                  int version = (packet[0] >> 4) & 0x0F;
                  if (version != 4) return;
                  int ihl = (packet[0] & 0x0F) * 4;
                  if (ihl < 20 || len < ihl + 8) return;
                  if ((packet[9] & 0xFF) != 17) return; // UDP
          
                  int srcPort = u16(packet, ihl);
                  int dstPort = u16(packet, ihl + 2);
                  int udpLength = u16(packet, ihl + 4);
                  int payloadOffset = ihl + 8;
                  int payloadLength = Math.min(Math.max(0, udpLength - 8), len - payloadOffset);
                  if (payloadLength <= 0) return;
          
                  byte[] srcIp = new byte[]{packet[12], packet[13], packet[14], packet[15]};
                  byte[] dstIp = new byte[]{packet[16], packet[17], packet[18], packet[19]};
          
                  List<OscMessage> messages = new ArrayList<>();
                  parseOsc(packet, payloadOffset, payloadLength, messages);
                  for (OscMessage m : messages) {
                      onOsc(m);
                      byte[] reply = createReply(m);
                      if (reply != null) {
                          // MixRemote expects the M18 control reply on its fixed OSC pair: mixer 8000 -> app 9000.
                          // The previous FULL-DSP build replied to the transient captured ports, which left MixRemote OFFLINE.
                          byte[] ipReply = buildUdpIpv4(dstIp, srcIp, 8000, 9000, reply);
                          out.write(ipReply);
                          out.flush();
                      }
                  }
              }
          
              private void onOsc(OscMessage m) {
                  boolean noise = isPollingNoise(m.address);
                  String valueText = valueText(m);
          
                  if (!noise) {
                      String line = m.address + valueText;
                      oscStatus = "RCF → phone: " + line;
                      appendRecent(line);
                  }
          
                  if (m.firstFloat != null) {
                      float v = m.firstFloat;
                      if (!isProtocolOnly(m.address)) state.put(m.address, v);
                      String mapped = dsp.handleOsc(m.address, v);
                      if (mapped != null) audioStatus = mapped;
                  }
              }
          
              private static boolean isPollingNoise(String address) {
                  return address != null && (address.contains("/pl_") || address.contains("/vmeter_") || address.contains("/vm_"));
              }
          
              private static boolean isProtocolOnly(String address) {
                  return address == null || address.contains("/pl_") || address.contains("/up_") || address.contains("/vmeter_") || address.contains("/vm_");
              }
          
              private static String valueText(OscMessage m) {
                  if (m.firstFloat != null) return "  " + String.format(Locale.US, "%.4f", m.firstFloat);
                  if (m.firstString != null) return "  \"" + m.firstString + "\"";
                  return "";
              }
          
              private static synchronized void appendRecent(String line) {
                  if (line == null || line.isEmpty()) return;
                  RECENT.addFirst(line);
                  while (RECENT.size() > 10) RECENT.removeLast();
                  StringBuilder b = new StringBuilder();
                  for (String s : RECENT) {
                      if (b.length() > 0) b.append('\n');
                      b.append(s);
                  }
                  recentOscLog = b.toString();
              }
          
              private byte[] createReply(OscMessage m) {
                  // Identity / firmware replies used by the original app during startup.
                  if ("/22/00/gb_100".equals(m.address)) return oscStringReply(m.address, "02.10.0225");
                  if ("/22/00/gb_146".equals(m.address)) return oscStringReply(m.address, "0");
                  if ("/22/00/gb_275".equals(m.address)) return oscStringReply(m.address, "RCFBRIDGE001");
                  if ("/27/00/gb_078".equals(m.address) || "/27/00/gb_78".equals(m.address)) return oscStringReply(m.address, "");
          
                  // MixRemote polling: return a quiet 41-channel meter frame, but do not let polling hide real controls in the UI.
                  if ("/00/00/pl_000".equals(m.address)) return oscMeterReply();
          
                  // When MixRemote requests a page/channel refresh, return all locally stored values for that page/channel.
                  AddressParts p = AddressParts.parse(m.address);
                  if (p != null && "up".equals(p.section)) {
                      byte[] bundle = stateBundleFor(p.page, p.channel);
                      if (bundle != null) return bundle;
                  }
          
                  // Echo control/state writes as acknowledgement. This keeps the original MixRemote controls visually synchronized.
                  if (m.firstFloat != null && !isProtocolOnly(m.address)) return oscFloatReply(m.address, m.firstFloat);
                  if (m.firstString != null && !isProtocolOnly(m.address)) return oscStringReply(m.address, m.firstString);
                  return null;
              }
          
              private byte[] stateBundleFor(int page, int channel) {
                  String prefix = String.format(Locale.US, "/%02d/%02d/", page, channel);
                  List<byte[]> entries = new ArrayList<>();
                  for (Map.Entry<String, Float> e : state.entrySet()) {
                      if (e.getKey().startsWith(prefix)) entries.add(oscFloatReply(e.getKey(), e.getValue()));
                  }
                  if (entries.isEmpty()) return null;
                  ByteArrayOutputStream out = new ByteArrayOutputStream();
                  writeOscString(out, "#bundle");
                  writeInt(out, 0); writeInt(out, 1); // immediate timetag
                  for (byte[] msg : entries) {
                      writeInt(out, msg.length);
                      out.write(msg, 0, msg.length);
                  }
                  return out.toByteArray();
              }
          
              private void initDefaultState() {
                  state.clear();
                  put(0,0,"fd",0,1f);
                  put(0,0,"mt",0,0f);
                  put(0,0,"gq",0,1f);
                  for (int i=1;i<=31;i++) put(0,0,"gq",i,0.5f);
                  put(0,0,"tw",0,0f); put(0,0,"tw",1,0.25f); put(0,0,"tw",2,1f);
                  put(0,0,"ex",0,0f); put(0,0,"ex",1,0.5f); put(0,0,"ex",2,0.5f);
                  put(0,0,"mx",0,0f); put(0,0,"mx",1,0f); put(0,0,"mx",2,1f);
          
                  for (int ch=0; ch<=5; ch++) {
                      put(11,ch,"fx",0,0f);
                      for (int c=1;c<=6;c++) put(11,ch,"fx",c,0.5f);
                      put(11,ch,"fx",7,0f);
                  }
          
