          /** Playlist PCM player: RCF DSP + automatic next-track BPM matching. */
          public final class PhoneAudioEngine {
              public interface StatusListener { void onStatus(String text, boolean playing, String trackText); }
          
              private final Context context;
              private final DspEngine dsp;
              private final StatusListener listener;
              private final List<Uri> playlist = new ArrayList<>();
              private final Map<String, Float> bpmCache = new ConcurrentHashMap<>();
          
              private volatile Uri uri;
