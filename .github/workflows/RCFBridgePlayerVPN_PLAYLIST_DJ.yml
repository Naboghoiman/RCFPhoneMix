              private volatile float masterBpm;
              private Thread worker;
              private Thread analyzer;
              private AudioTrack audioTrack;
          
              public PhoneAudioEngine(Context context, DspEngine dsp, StatusListener listener) {
                  this.context = context.getApplicationContext();
                  this.dsp = dsp;
                  this.listener = listener;
              }
          
              public synchronized void load(Uri newUri) {
                  ArrayList<Uri> one = new ArrayList<>();
                  if (newUri != null) one.add(newUri);
                  loadPlaylist(one);
              }
          
              public synchronized void loadPlaylist(List<Uri> items) {
                  stopInternal();
                  playlist.clear();
                  if (items != null) for (Uri u : items) if (u != null) playlist.add(u);
                  currentIndex = 0;
                  uri = playlist.isEmpty() ? null : playlist.get(0);
                  ready = uri != null;
                  playing = false;
                  masterBpm = 0f;
                  if (ready) {
                      startBpmAnalysis();
                      notifyStatus("Playlist ready — " + playlist.size() + " songs • AUTO DJ BPM match ON");
                  } else {
                      notifyStatus("Select a playlist.");
                  }
              }
          
              public synchronized void toggle() {
                  if (!ready || uri == null) {
                      notifyStatus("Select a playlist first.");
                      return;
                  }
                  if (worker == null || !worker.isAlive()) {
                      playing = true;
                      startCurrentWorkerLocked();
                      notifyStatus("Playing — RCF DSP + AUTO DJ active");
                      return;
                  }
                  playing = !playing;
                  AudioTrack t = audioTrack;
                  try {
                      if (t != null) {
                          if (playing) t.play(); else t.pause();
                      }
                  } catch (Exception ignored) {}
                  notifyStatus(playing ? "Playing — RCF DSP + AUTO DJ active" : "Paused");
              }
          
              public boolean isPlaying() { return playing; }
          
              public synchronized void release() {
                  stopInternal();
                  playlist.clear();
                  uri = null;
                  ready = false;
                  notifyStatus("Select a playlist.");
              }
          
              private synchronized void startCurrentWorkerLocked() {
                  if (uri == null) return;
                  final int myGeneration = ++generation;
                  final Uri selected = uri;
                  worker = new Thread(() -> decodeLoop(myGeneration, selected), "RCF-PCM-AUDIO");
                  worker.start();
              }
          
              private synchronized void stopInternal() {
                  generation++;
