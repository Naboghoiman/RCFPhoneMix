      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify and rename APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk RCFPhoneMix.apk
          sha256sum RCFPhoneMix.apk | tee RCFPhoneMix.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RCFPhoneMix-APK
          path: |
            RCFPhoneMix.apk
            RCFPhoneMix.sha256
          if-no-files-found: error
          retention-days: 30
