name: Build RCF djay Bridge v13 CLEAN

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/RCF_DJAY_BRIDGE_V13_CLEAN.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate clean Android bridge project
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/rcf-djay-bridge"
          rm -rf "$P"
          mkdir -p "$P/app/src/main/java/com/iman/rcfdjaybridge" "$P/app/src/main/res/xml"
          cat > "$P/settings.gradle" <<'FILE_0_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          
          rootProject.name = 'RcfDjayBridge'
          include ':app'
          FILE_0_EOF

          cat > "$P/build.gradle" <<'FILE_1_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          FILE_1_EOF

          cat > "$P/gradle.properties" <<'FILE_2_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          FILE_2_EOF

          cat > "$P/app/build.gradle" <<'FILE_3_EOF'
          plugins {
              id 'com.android.application'
          }
          
          android {
              namespace 'com.iman.rcfdjaybridge'
              compileSdk 35
          
              defaultConfig {
                  applicationId 'com.iman.rcfdjaybridge'
                  minSdk 23
                  targetSdk 33
                  versionCode 13
                  versionName '13.0-clean-learn'
              }
          
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          FILE_3_EOF

          cat > "$P/app/src/main/AndroidManifest.xml" <<'FILE_4_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-feature android:name="android.software.midi" android:required="false" />
          
              <application
                  android:allowBackup="true"
                  android:label="RCF djay Bridge"
                  android:theme="@android:style/Theme.Material.NoActionBar">
          
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
          
                  <service
                      android:name=".BridgeVpnService"
                      android:exported="false"
                      android:permission="android.permission.BIND_VPN_SERVICE">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                  </service>
          
                  <service
                      android:name=".RcfMidiDeviceService"
                      android:label="Hercules DJControl MIX"
                      android:permission="android.permission.BIND_MIDI_DEVICE_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.media.midi.MidiDeviceService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.media.midi.MidiDeviceService"
                          android:resource="@xml/midi_device_info" />
                  </service>
              </application>
          </manifest>
          FILE_4_EOF

          cat > "$P/app/src/main/res/xml/midi_device_info.xml" <<'FILE_5_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <devices>
              <device manufacturer="Hercules" product="DJControl MIX">
                  <input-port name="DJControl MIX MIDI In" />
                  <output-port name="DJControl MIX MIDI Out" />
              </device>
          </devices>
          FILE_5_EOF

          cat > "$P/app/src/main/java/com/iman/rcfdjaybridge/MainActivity.java" <<'FILE_6_EOF'
          package com.iman.rcfdjaybridge;
          
          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.VpnService;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          
          public class MainActivity extends Activity {
              private static final int PREPARE_VPN = 7101;
              private static final int NOTIFY_PERMISSION = 7102;
          
              private final Handler handler = new Handler(Looper.getMainLooper());
              private TextView bridgeStatus;
              private TextView midiStatus;
              private TextView rcfStatus;
              private TextView learnStatus;
              private TextView mappingsStatus;
          
              private final Runnable tick = new Runnable() {
                  @Override public void run() {
                      if (bridgeStatus != null) bridgeStatus.setText(BridgeVpnService.vpnStatus);
                      if (midiStatus != null) midiStatus.setText(RcfMidiDeviceService.midiStatus);
                      if (rcfStatus != null) rcfStatus.setText(BridgeVpnService.oscStatus);
                      if (learnStatus != null) learnStatus.setText(RcfMidiMapper.learnStatus(MainActivity.this));
                      if (mappingsStatus != null) mappingsStatus.setText(RcfMidiMapper.mappingSummary(MainActivity.this));
                      handler.postDelayed(this, 400L);
                  }
              };
          
              @Override protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  buildUi();
                  requestNotificationPermissionIfNeeded();
              }
          
              @Override protected void onResume() {
                  super.onResume();
                  handler.removeCallbacks(tick);
                  handler.post(tick);
              }
          
              @Override protected void onPause() {
                  handler.removeCallbacks(tick);
                  super.onPause();
              }
          
              private void buildUi() {
                  ScrollView scroll = new ScrollView(this);
                  scroll.setBackgroundColor(Color.rgb(16, 18, 22));
          
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(18), dp(18), dp(18), dp(28));
          
                  TextView title = text("RCF → djay MIDI BRIDGE", 23, Color.WHITE, true);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title, full());
          
                  TextView sub = text("PURE BRIDGE • NO MUSIC PLAYER • HERCULES DJCONTROL MIX MIDI", 11, Color.rgb(80, 190, 240), true);
                  sub.setGravity(Gravity.CENTER);
                  sub.setPadding(0, dp(5), 0, dp(16));
                  root.addView(sub, full());
          
                  Button start = button("START RCF BRIDGE");
                  start.setOnClickListener(v -> prepareVpn());
                  root.addView(start, height(54));
          
                  root.addView(heading("BRIDGE"), top(12));
                  bridgeStatus = status("Bridge stopped");
                  root.addView(bridgeStatus, full());
          
                  root.addView(heading("DJAY MIDI"), top(10));
                  midiStatus = status("Virtual MIDI registered — open djay MIDI devices");
                  root.addView(midiStatus, full());
          
                  LinearLayout tests = new LinearLayout(this);
                  tests.setOrientation(LinearLayout.HORIZONTAL);
                  Button testA = button("TEST PLAY A");
                  testA.setOnClickListener(v -> RcfMidiDeviceService.testPlayA());
                  tests.addView(testA, weight());
                  Button testB = button("TEST PLAY B");
                  testB.setOnClickListener(v -> RcfMidiDeviceService.testPlayB());
                  LinearLayout.LayoutParams wb = weight();
                  wb.setMargins(dp(8), 0, 0, 0);
                  tests.addView(testB, wb);
                  root.addView(tests, top(8));
          
                  root.addView(heading("LAST RCF COMMAND"), top(12));
                  rcfStatus = status("Waiting for MixRemote controls…");
                  root.addView(rcfStatus, full());
          
                  root.addView(heading("LEARN MODE"), top(14));
                  TextView help = text(
                          "Tap a LEARN button, then move or press the RCF control you want to use. " +
                          "The bridge remembers that RCF control and sends the matching Hercules command to djay.",
                          13, Color.LTGRAY, false);
                  root.addView(help, full());
          
                  learnStatus = status("No learn target selected");
                  root.addView(learnStatus, top(7));
          
                  addLearn(root, "LEARN CROSSFADER", RcfMidiMapper.F_CROSSFADER);
                  addLearn(root, "LEARN MASTER VOLUME", RcfMidiMapper.F_MASTER_VOLUME);
                  addLearn(root, "LEARN DECK A VOLUME", RcfMidiMapper.F_DECK_A_VOLUME);
                  addLearn(root, "LEARN DECK B VOLUME", RcfMidiMapper.F_DECK_B_VOLUME);
                  addLearn(root, "LEARN DECK A FILTER", RcfMidiMapper.F_DECK_A_FILTER);
                  addLearn(root, "LEARN DECK B FILTER", RcfMidiMapper.F_DECK_B_FILTER);
                  addLearn(root, "LEARN DECK A BASS", RcfMidiMapper.F_DECK_A_EQ_LOW);
                  addLearn(root, "LEARN DECK B BASS", RcfMidiMapper.F_DECK_B_EQ_LOW);
                  addLearn(root, "LEARN PLAY A", RcfMidiMapper.F_PLAY_A);
                  addLearn(root, "LEARN PLAY B", RcfMidiMapper.F_PLAY_B);
                  addLearn(root, "LEARN CUE A", RcfMidiMapper.F_CUE_A);
                  addLearn(root, "LEARN CUE B", RcfMidiMapper.F_CUE_B);
                  addLearn(root, "LEARN SYNC A", RcfMidiMapper.F_SYNC_A);
                  addLearn(root, "LEARN SYNC B", RcfMidiMapper.F_SYNC_B);
          
                  root.addView(heading("SAVED MAPPINGS"), top(14));
                  mappingsStatus = status("No mappings saved yet");
                  mappingsStatus.setTypeface(android.graphics.Typeface.MONOSPACE);
                  root.addView(mappingsStatus, full());
          
                  Button clear = button("CLEAR ALL LEARNED MAPPINGS");
                  clear.setOnClickListener(v -> {
                      RcfMidiMapper.clearMappings(this);
                      Toast.makeText(this, "Learned mappings cleared", Toast.LENGTH_SHORT).show();
                  });
                  root.addView(clear, top(10));
          
                  TextView instructions = text(
                          "USE: 1) Start RCF Bridge and allow the Android VPN prompt. " +
                          "2) Open the original RCF MixRemote. The bridge pretends to be the M18 so RCF commands reach this phone. " +
                          "3) In djay, open Settings → MIDI Devices and choose Hercules DJControl MIX if it appears. " +
                          "4) Tap TEST PLAY A. If Deck A responds, MIDI is connected. " +
                          "5) Return here, choose a LEARN function, then move the desired RCF control.",
                          12, Color.GRAY, false);
                  instructions.setPadding(0, dp(18), 0, 0);
                  root.addView(instructions, full());
          
                  scroll.addView(root);
                  setContentView(scroll);
              }
          
              private void addLearn(LinearLayout root, String label, String function) {
                  Button b = button(label);
                  b.setOnClickListener(v -> {
                      RcfMidiMapper.requestLearn(this, function);
                      Toast.makeText(this, "Now move/press the RCF control", Toast.LENGTH_SHORT).show();
                  });
                  root.addView(b, top(7));
              }
          
              private void prepareVpn() {
                  Intent permission = VpnService.prepare(this);
                  if (permission != null) startActivityForResult(permission, PREPARE_VPN);
                  else startBridgeService();
              }
          
              private void startBridgeService() {
                  Intent i = new Intent(this, BridgeVpnService.class);
                  i.setAction(BridgeVpnService.ACTION_START);
                  if (Build.VERSION.SDK_INT >= 26) startForegroundService(i); else startService(i);
              }
          
              @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == PREPARE_VPN) {
                      if (resultCode == RESULT_OK) startBridgeService();
                      else Toast.makeText(this, "VPN permission is required to receive MixRemote commands", Toast.LENGTH_LONG).show();
                  }
              }
          
              private void requestNotificationPermissionIfNeeded() {
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, NOTIFY_PERMISSION);
                  }
              }
          
              private TextView heading(String s) {
                  TextView t = text(s, 12, Color.rgb(80, 190, 240), true);
                  t.setPadding(0, dp(8), 0, dp(4));
                  return t;
              }
          
              private TextView status(String s) {
                  TextView t = text(s, 13, Color.WHITE, false);
                  t.setBackgroundColor(Color.rgb(32, 35, 41));
                  t.setPadding(dp(10), dp(10), dp(10), dp(10));
                  return t;
              }
          
              private TextView text(String s, int sp, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(sp);
                  t.setTextColor(color);
                  if (bold) t.setTypeface(android.graphics.Typeface.DEFAULT_BOLD);
                  return t;
              }
          
              private Button button(String s) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setAllCaps(false);
                  return b;
              }
          
              private LinearLayout.LayoutParams full() {
                  return new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
              }
          
              private LinearLayout.LayoutParams height(int h) {
                  return new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(h));
              }
          
              private LinearLayout.LayoutParams top(int px) {
                  LinearLayout.LayoutParams p = full();
                  p.setMargins(0, dp(px), 0, 0);
                  return p;
              }
          
              private LinearLayout.LayoutParams weight() {
                  return new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);
              }
          
              private int dp(int v) {
                  return Math.round(v * getResources().getDisplayMetrics().density);
              }
          }
          FILE_6_EOF

          cat > "$P/app/src/main/java/com/iman/rcfdjaybridge/RcfMidiDeviceService.java" <<'FILE_7_EOF'
          package com.iman.rcfdjaybridge;
          
          import android.media.midi.MidiDeviceService;
          import android.media.midi.MidiDeviceStatus;
          import android.media.midi.MidiReceiver;
          
          import java.io.IOException;
          import java.util.Locale;
          
          /**
           * Android virtual MIDI 1.0 device that presents itself as a Hercules DJControl MIX.
           * MIDI numbers follow the Hercules DJControl MIX mapping used by supported DJ software.
           */
          public final class RcfMidiDeviceService extends MidiDeviceService {
              public static volatile String midiStatus = "Virtual Hercules MIDI registered — open djay MIDI Devices";
              private static volatile RcfMidiDeviceService instance;
              private static volatile int clientCount;
          
              private final MidiReceiver inputSink = new MidiReceiver() {
                  @Override public void onSend(byte[] msg, int offset, int count, long timestamp) {
                      if (msg != null && count > 0) {
                          midiStatus = "djay/controller feedback received • " + count + " MIDI bytes";
                      }
                  }
              };
          
              @Override public void onCreate() {
                  super.onCreate();
                  instance = this;
                  midiStatus = "Virtual Hercules MIDI ACTIVE — waiting for djay to open it";
              }
          
              @Override public void onDestroy() {
                  if (instance == this) instance = null;
                  clientCount = 0;
                  midiStatus = "Virtual Hercules MIDI service idle";
                  super.onDestroy();
              }
          
              @Override public MidiReceiver[] onGetInputPortReceivers() {
                  return new MidiReceiver[]{inputSink};
              }
          
              @Override public void onDeviceStatusChanged(MidiDeviceStatus status) {
                  clientCount = status == null ? 0 : status.getOutputPortOpenCount(0);
                  if (clientCount > 0) {
                      midiStatus = "DJAY MIDI CONNECTED • " + clientCount + " client(s) listening";
                  } else {
                      midiStatus = "Virtual Hercules MIDI ACTIVE — open it in djay";
                  }
              }
          
              public static boolean isClientConnected() {
                  return clientCount > 0;
              }
          
              private static boolean send3(int status, int data1, int data2, String label) {
                  RcfMidiDeviceService s = instance;
                  if (s == null) {
                      midiStatus = "MIDI not opened yet — in djay choose Hercules DJControl MIX";
                      return false;
                  }
                  MidiReceiver[] receivers = s.getOutputPortReceivers();
                  if (receivers == null || receivers.length == 0 || receivers[0] == null) {
                      midiStatus = "Hercules device exists, but djay has not opened its MIDI OUT port";
                      return false;
                  }
                  byte[] m = new byte[]{(byte)status, (byte)(data1 & 0x7F), (byte)(data2 & 0x7F)};
                  try {
                      receivers[0].send(m, 0, m.length, System.nanoTime());
                      midiStatus = label + " → " + String.format(Locale.US, "%02X %02X %02X", status & 0xFF, data1 & 0x7F, data2 & 0x7F);
                      return true;
                  } catch (IOException e) {
                      midiStatus = "MIDI send error: " + (e.getMessage() == null ? "unknown" : e.getMessage());
                      return false;
                  }
              }
          
              private static void notePulse(int status, int note, String label) {
                  if (send3(status, note, 0x7F, label + " press")) {
                      send3(status, note, 0x00, label + " release");
                  }
              }
          
              private static void cc(int status, int controller, float value, String label) {
                  float v = Math.max(0f, Math.min(1f, value));
                  int data = Math.max(0, Math.min(127, Math.round(v * 127f)));
                  send3(status, controller, data, label);
              }
          
              public static void testPlayA() { notePulse(0x91, 0x07, "TEST PLAY A"); }
              public static void testPlayB() { notePulse(0x92, 0x07, "TEST PLAY B"); }
          
              public static void sendContinuous(String function, float value) {
                  switch (function) {
                      case RcfMidiMapper.F_CROSSFADER:
                          cc(0xB0, 0x00, value, "Crossfader"); break;
                      case RcfMidiMapper.F_MASTER_VOLUME:
                          cc(0xB0, 0x03, value, "Master volume"); break;
                      case RcfMidiMapper.F_HEADPHONE_VOLUME:
                          cc(0xB0, 0x04, value, "Headphone volume"); break;
                      case RcfMidiMapper.F_DECK_A_VOLUME:
                          cc(0xB1, 0x00, value, "Deck A volume"); break;
                      case RcfMidiMapper.F_DECK_A_FILTER:
                          cc(0xB1, 0x01, value, "Deck A filter"); break;
                      case RcfMidiMapper.F_DECK_A_EQ_LOW:
                          cc(0xB1, 0x02, value, "Deck A bass"); break;
                      case RcfMidiMapper.F_DECK_B_VOLUME:
                          cc(0xB2, 0x00, value, "Deck B volume"); break;
                      case RcfMidiMapper.F_DECK_B_FILTER:
                          cc(0xB2, 0x01, value, "Deck B filter"); break;
                      case RcfMidiMapper.F_DECK_B_EQ_LOW:
                          cc(0xB2, 0x02, value, "Deck B bass"); break;
                  }
              }
          
              public static void sendButton(String function) {
                  switch (function) {
                      case RcfMidiMapper.F_PLAY_A:
                          notePulse(0x91, 0x07, "Play A"); break;
                      case RcfMidiMapper.F_CUE_A:
                          notePulse(0x91, 0x06, "Cue A"); break;
                      case RcfMidiMapper.F_SYNC_A:
                          notePulse(0x91, 0x05, "Sync A"); break;
                      case RcfMidiMapper.F_PFL_A:
                          notePulse(0x91, 0x0C, "PFL A"); break;
                      case RcfMidiMapper.F_PLAY_B:
                          notePulse(0x92, 0x07, "Play B"); break;
                      case RcfMidiMapper.F_CUE_B:
                          notePulse(0x92, 0x06, "Cue B"); break;
                      case RcfMidiMapper.F_SYNC_B:
                          notePulse(0x92, 0x05, "Sync B"); break;
                      case RcfMidiMapper.F_PFL_B:
                          notePulse(0x92, 0x0C, "PFL B"); break;
                  }
              }
          }
          FILE_7_EOF

          cat > "$P/app/src/main/java/com/iman/rcfdjaybridge/RcfMidiMapper.java" <<'FILE_8_EOF'
          package com.iman.rcfdjaybridge;
          
          import android.content.Context;
          import android.content.SharedPreferences;
          
          import java.util.LinkedHashMap;
          import java.util.Locale;
          import java.util.Map;
          import java.util.concurrent.ConcurrentHashMap;
          
          /** Learns RCF OSC addresses and translates them to Hercules DJControl MIX MIDI functions. */
          public final class RcfMidiMapper {
              private RcfMidiMapper() {}
          
              private static final String PREFS = "rcf_djay_mappings_v13";
              private static final String PENDING = "pending_function";
              private static final String PREFIX = "map.";
          
              public static final String F_CROSSFADER = "crossfader";
              public static final String F_MASTER_VOLUME = "master_volume";
              public static final String F_HEADPHONE_VOLUME = "headphone_volume";
              public static final String F_DECK_A_VOLUME = "deck_a_volume";
              public static final String F_DECK_B_VOLUME = "deck_b_volume";
              public static final String F_DECK_A_FILTER = "deck_a_filter";
              public static final String F_DECK_B_FILTER = "deck_b_filter";
              public static final String F_DECK_A_EQ_LOW = "deck_a_bass";
              public static final String F_DECK_B_EQ_LOW = "deck_b_bass";
              public static final String F_PLAY_A = "play_a";
              public static final String F_PLAY_B = "play_b";
              public static final String F_CUE_A = "cue_a";
              public static final String F_CUE_B = "cue_b";
              public static final String F_SYNC_A = "sync_a";
              public static final String F_SYNC_B = "sync_b";
              public static final String F_PFL_A = "pfl_a";
              public static final String F_PFL_B = "pfl_b";
          
              private static final Map<String, Float> lastValues = new ConcurrentHashMap<>();
              private static volatile String lastLearned = "";
          
              private static final LinkedHashMap<String, String> LABELS = new LinkedHashMap<>();
              static {
                  LABELS.put(F_CROSSFADER, "Crossfader");
                  LABELS.put(F_MASTER_VOLUME, "Master volume");
                  LABELS.put(F_HEADPHONE_VOLUME, "Headphone volume");
                  LABELS.put(F_DECK_A_VOLUME, "Deck A volume");
                  LABELS.put(F_DECK_B_VOLUME, "Deck B volume");
                  LABELS.put(F_DECK_A_FILTER, "Deck A filter");
                  LABELS.put(F_DECK_B_FILTER, "Deck B filter");
                  LABELS.put(F_DECK_A_EQ_LOW, "Deck A bass");
                  LABELS.put(F_DECK_B_EQ_LOW, "Deck B bass");
                  LABELS.put(F_PLAY_A, "Play A");
                  LABELS.put(F_PLAY_B, "Play B");
                  LABELS.put(F_CUE_A, "Cue A");
                  LABELS.put(F_CUE_B, "Cue B");
                  LABELS.put(F_SYNC_A, "Sync A");
                  LABELS.put(F_SYNC_B, "Sync B");
                  LABELS.put(F_PFL_A, "PFL A");
                  LABELS.put(F_PFL_B, "PFL B");
              }
          
              public static void requestLearn(Context context, String function) {
                  if (!LABELS.containsKey(function)) return;
                  prefs(context).edit().putString(PENDING, function).apply();
                  lastLearned = "Waiting for RCF control → " + label(function);
              }
          
              public static String learnStatus(Context context) {
                  String pending = prefs(context).getString(PENDING, "");
                  if (pending != null && !pending.isEmpty()) return "LEARNING: " + label(pending) + " — move/press an RCF control now";
                  if (lastLearned != null && !lastLearned.isEmpty()) return lastLearned;
                  return "No learn target selected";
              }
          
              public static void clearMappings(Context context) {
                  SharedPreferences p = prefs(context);
                  SharedPreferences.Editor e = p.edit();
                  for (String f : LABELS.keySet()) e.remove(PREFIX + f);
                  e.remove(PENDING).apply();
                  lastValues.clear();
                  lastLearned = "All learned mappings cleared";
              }
          
              public static String mappingSummary(Context context) {
                  SharedPreferences p = prefs(context);
                  StringBuilder b = new StringBuilder();
                  for (Map.Entry<String, String> entry : LABELS.entrySet()) {
                      String a = p.getString(PREFIX + entry.getKey(), "");
                      if (a != null && !a.isEmpty()) {
                          if (b.length() > 0) b.append('\n');
                          b.append(entry.getValue()).append(" ← ").append(a);
                      }
                  }
