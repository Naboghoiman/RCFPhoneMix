                  if ("/22/00/gb_100".equals(m.address)) return oscStringReply(m.address, "02.10.0225");
                  if ("/22/00/gb_146".equals(m.address)) return oscStringReply(m.address, "0");
                  if ("/22/00/gb_275".equals(m.address)) return oscStringReply(m.address, "RCFDJAY001");
                  if ("/27/00/gb_078".equals(m.address) || "/27/00/gb_78".equals(m.address)) return oscStringReply(m.address, "");
          
