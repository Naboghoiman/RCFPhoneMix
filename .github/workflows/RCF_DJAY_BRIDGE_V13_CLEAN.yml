              public static void onRcfOsc(Context context, String address, float rawValue) {
                  if (address == null || isProtocolNoise(address)) return;
                  SharedPreferences p = prefs(context);
          
                  String pending = p.getString(PENDING, "");
                  if (pending != null && !pending.isEmpty() && LABELS.containsKey(pending)) {
                      p.edit().putString(PREFIX + pending, address).remove(PENDING).apply();
                      lastLearned = "SAVED: " + label(pending) + " ← " + address;
                      lastValues.put(address, rawValue);
                      return;
                  }
          
                  float value = normalize(rawValue);
                  for (String function : LABELS.keySet()) {
                      String mapped = p.getString(PREFIX + function, "");
                      if (address.equals(mapped)) {
                          if (isButton(function)) {
                              float previous = lastValues.containsKey(address) ? lastValues.get(address) : 0f;
                              if (value >= 0.5f && previous < 0.5f) RcfMidiDeviceService.sendButton(function);
                          } else {
                              RcfMidiDeviceService.sendContinuous(function, value);
                          }
                      }
                  }
                  lastValues.put(address, value);
              }
          
              private static boolean isButton(String f) {
                  return F_PLAY_A.equals(f) || F_PLAY_B.equals(f) || F_CUE_A.equals(f) || F_CUE_B.equals(f)
                          || F_SYNC_A.equals(f) || F_SYNC_B.equals(f) || F_PFL_A.equals(f) || F_PFL_B.equals(f);
              }
          
              private static boolean isProtocolNoise(String a) {
                  return a.contains("/pl_") || a.contains("/up_") || a.contains("/vmeter_") || a.contains("/vm_");
              }
          
              private static float normalize(float v) {
                  if (Float.isNaN(v) || Float.isInfinite(v)) return 0f;
                  if (v >= 0f && v <= 1f) return v;
                  // Graceful fallback for controls that expose dB-like values rather than normalized 0..1.
                  if (v < 0f) return Math.max(0f, Math.min(1f, (v + 60f) / 60f));
                  return Math.max(0f, Math.min(1f, v / 127f));
              }
          
              private static String label(String f) {
                  String s = LABELS.get(f);
                  return s == null ? f : s;
              }
          
              private static SharedPreferences prefs(Context context) {
                  return context.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
              }
          }
