                  put16(p, 2, total);
                  put16(p, 4, packetId++ & 0xFFFF);
                  p[8] = 64;
                  p[9] = 17;
                  System.arraycopy(src, 0, p, 12, 4);
                  System.arraycopy(dst, 0, p, 16, 4);
                  put16(p, 20, srcPort);
                  put16(p, 22, dstPort);
                  put16(p, 24, 8 + payload.length);
                  System.arraycopy(payload, 0, p, 28, payload.length);
                  put16(p, 10, ipChecksum(p, 0, 20));
                  return p;
