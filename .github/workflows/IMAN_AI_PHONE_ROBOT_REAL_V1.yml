name: Build IMAN AI PHONE ROBOT REAL v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/IMAN_AI_PHONE_ROBOT_REAL_V1.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate native app
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/iman-robot"
          mkdir -p "$P/app/src/main/java/com/iman/airobot" "$P/app/src/main/res/values"

          cat > "$P/settings.gradle" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name='ImanAiRobot'
          include ':app'
          EOF

          cat > "$P/build.gradle" <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > "$P/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat > "$P/app/build.gradle" <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.iman.airobot'
            compileSdk 35
            defaultConfig {
              applicationId 'com.iman.airobot'
              minSdk 26
              targetSdk 35
              versionCode 1
              versionName '1.0-real'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF

          cat > "$P/app/src/main/res/values/strings.xml" <<'EOF'
          <resources><string name="app_name">IMAN AI ROBOT</string></resources>
          EOF

          cat > "$P/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.RECORD_AUDIO"/>
            <uses-permission android:name="android.permission.READ_CONTACTS"/>
            <uses-permission android:name="android.permission.CALL_PHONE"/>
            <uses-permission android:name="android.permission.CAMERA"/>
            <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
            <queries>
              <intent>
                <action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/>
              </intent>
            </queries>
            <application android:label="@string/app_name"
              android:theme="@android:style/Theme.Material.NoActionBar"
              android:usesCleartextTraffic="false">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > "$P/app/src/main/java/com/iman/airobot/MainActivity.java" <<'EOF'
          package com.iman.airobot;

          import android.Manifest;
          import android.app.*;
          import android.content.*;
          import android.content.pm.*;
          import android.database.Cursor;
          import android.graphics.Color;
          import android.hardware.camera2.*;
          import android.media.*;
          import android.net.Uri;
          import android.os.*;
          import android.provider.*;
          import android.speech.RecognizerIntent;
          import android.speech.tts.TextToSpeech;
          import android.view.Gravity;
          import android.widget.*;
          import org.json.*;
          import java.io.*;
          import java.net.*;
          import java.nio.charset.StandardCharsets;
          import java.util.*;
          import java.util.concurrent.*;

          public class MainActivity extends Activity {
            static final int VOICE=5, PERMS=6;
            TextView status, chat; EditText command;
            TextToSpeech tts; MediaPlayer player;
            final ExecutorService exec=Executors.newSingleThreadExecutor();

            String pref(String k){return getSharedPreferences("iman",0).getString(k,"");}
            void pref(String k,String v){getSharedPreferences("iman",0).edit().putString(k,v).apply();}

            @Override public void onCreate(Bundle b){
              super.onCreate(b); ui(); askPerms();
              tts=new TextToSpeech(this,s->{if(s==TextToSpeech.SUCCESS)tts.setLanguage(Locale.getDefault());});
              if(pref("server").isEmpty()) settings();
              else status.setText("READY • ONLINE");
            }

            void ui(){
              ScrollView sc=new ScrollView(this); sc.setBackgroundColor(Color.rgb(7,17,28));
              LinearLayout r=new LinearLayout(this); r.setOrientation(LinearLayout.VERTICAL);
              r.setPadding(dp(18),dp(22),dp(18),dp(26));

              TextView title=t("IMAN AI PHONE ROBOT",25,Color.WHITE,true); title.setGravity(Gravity.CENTER); r.addView(title);
              TextView sub=t("ONLINE BRAIN • VOICE • MUSIC • CALLS • PHONE TOOLS",11,Color.CYAN,true);
              sub.setGravity(Gravity.CENTER); sub.setPadding(0,dp(5),0,dp(16)); r.addView(sub);

              TextView face=t("●       ●\n\n━━━",55,Color.CYAN,true); face.setGravity(Gravity.CENTER);
              face.setBackgroundColor(Color.rgb(10,27,42)); face.setPadding(0,dp(25),0,dp(25));
              r.addView(face,new LinearLayout.LayoutParams(-1,dp(220)));

              status=t("STARTING…",13,Color.CYAN,true); status.setGravity(Gravity.CENTER); status.setPadding(0,dp(10),0,dp(10)); r.addView(status);

              chat=t("Try: “Play Perfect”, “Call John”, “Open WhatsApp”, “Set alarm for 6 AM”, “Turn on flashlight”, or ask any question.",14,Color.WHITE,false);
              chat.setBackgroundColor(Color.rgb(10,23,35)); chat.setPadding(dp(12),dp(12),dp(12),dp(12));
              r.addView(chat,new LinearLayout.LayoutParams(-1,dp(235)));

              LinearLayout row=new LinearLayout(this); row.setOrientation(LinearLayout.HORIZONTAL);
              command=new EditText(this); command.setHint("Tell IMAN what to do…"); command.setTextColor(Color.WHITE); command.setHintTextColor(Color.GRAY);
              command.setBackgroundColor(Color.rgb(14,34,50)); row.addView(command,new LinearLayout.LayoutParams(0,dp(58),1));
              Button send=b("SEND"); LinearLayout.LayoutParams bp=new LinearLayout.LayoutParams(dp(96),dp(58)); bp.setMargins(dp(8),0,0,0); row.addView(send,bp);
              send.setOnClickListener(v->go(command.getText().toString())); r.addView(row);

              Button talk=b("🎤 TALK TO IMAN"); talk.setOnClickListener(v->voice()); r.addView(talk,top(9));
              Button settings=b("SERVER SETTINGS"); settings.setOnClickListener(v->settings()); r.addView(settings,top(8));
              sc.addView(r); setContentView(sc);
            }

            void settings(){
              LinearLayout box=new LinearLayout(this); box.setOrientation(LinearLayout.VERTICAL); box.setPadding(dp(12),0,dp(12),0);
              EditText url=new EditText(this); url.setHint("https://your-iman-server.onrender.com"); url.setText(pref("server"));
              EditText tok=new EditText(this); tok.setHint("IMAN app token"); tok.setText(pref("token"));
              box.addView(url); box.addView(tok);
              new AlertDialog.Builder(this).setTitle("IMAN online server").setView(box)
                .setPositiveButton("SAVE",(d,w)->{
                  String u=url.getText().toString().trim().replaceAll("/+$","");
                  pref("server",u); pref("token",tok.getText().toString().trim());
                  status.setText(u.isEmpty()?"SERVER NOT SET":"READY • ONLINE");
                }).setNegativeButton("CANCEL",null).show();
            }

            void voice(){
              Intent i=new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
              i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL,RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
              i.putExtra(RecognizerIntent.EXTRA_LANGUAGE,Locale.getDefault());
              try{status.setText("LISTENING…");startActivityForResult(i,VOICE);}
              catch(Exception e){say("Speech recognition is unavailable.");}
            }

            @Override protected void onActivityResult(int q,int result,Intent data){
              super.onActivityResult(q,result,data);
              if(q==VOICE&&result==RESULT_OK&&data!=null){
                ArrayList<String> x=data.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS);
                if(x!=null&&!x.isEmpty())go(x.get(0));
              } else status.setText("READY");
            }

            void go(String text){
              text=text==null?"":text.trim(); if(text.isEmpty())return;
              final String user=text; command.setText("");
              chat.setText("YOU: "+user+"\n\nIMAN: Thinking…"); status.setText("THINKING ONLINE…");
              exec.execute(()->{
                try{
                  JSONObject req=new JSONObject(); req.put("text",user); req.put("memory",pref("memory"));
                  URL u=new URL(pref("server")+"/agent"); HttpURLConnection c=(HttpURLConnection)u.openConnection();
                  c.setRequestMethod("POST"); c.setDoOutput(true); c.setConnectTimeout(15000); c.setReadTimeout(60000);
                  c.setRequestProperty("Content-Type","application/json");
                  if(!pref("token").isEmpty())c.setRequestProperty("x-iman-token",pref("token"));
                  try(OutputStream o=c.getOutputStream()){o.write(req.toString().getBytes(StandardCharsets.UTF_8));}
                  String raw=read(c.getResponseCode()<300?c.getInputStream():c.getErrorStream());
                  if(c.getResponseCode()>=300)throw new Exception(raw);
                  JSONObject a=new JSONObject(raw);
                  runOnUiThread(()->execute(user,a));
                }catch(Exception e){runOnUiThread(()->{status.setText("CONNECTION ERROR");chat.setText("YOU: "+user+"\n\nERROR: "+e.getMessage());});}
              });
            }

            void execute(String user,JSONObject a){
              String act=a.optString("action","answer"), arg=a.optString("argument",""), reply=a.optString("response","");
              String result="";
              try{
                switch(act){
                  case "play_song": result=play(arg); break;
                  case "pause_music": if(player!=null&&player.isPlaying()){player.pause();result="Music paused.";} break;
                  case "resume_music": if(player!=null){player.start();result="Music resumed.";} break;
                  case "stop_music": if(player!=null){player.stop();player.release();player=null;result="Music stopped.";} break;
                  case "call_contact": result=call(arg); break;
                  case "open_app": result=openApp(arg); break;
                  case "set_alarm": result=alarm(arg); break;
                  case "flashlight_on": result=torch(true); break;
                  case "flashlight_off": result=torch(false); break;
                  case "volume_up": result=vol(true); break;
                  case "volume_down": result=vol(false); break;
                  case "take_photo": startActivity(new Intent(MediaStore.ACTION_IMAGE_CAPTURE)); result="Opening camera."; break;
                  case "web_search": startActivity(new Intent(Intent.ACTION_VIEW,Uri.parse("https://www.google.com/search?q="+Uri.encode(arg)))); result="Searching for "+arg+"."; break;
                }
              }catch(Exception e){result="I couldn't complete that action: "+e.getMessage();}
              String spoken=!result.isEmpty()?result:reply; if(spoken.isEmpty())spoken="Done.";
              chat.setText("YOU: "+user+"\n\nIMAN: "+spoken+"\n\nACTION: "+act+(arg.isEmpty()?"":" → "+arg));
              status.setText("READY • ONLINE"); say(spoken);
              String mem=(pref("memory")+"\nuser: "+user+"\nassistant: "+spoken); if(mem.length()>7000)mem=mem.substring(mem.length()-7000); pref("memory",mem);
            }

            String play(String q)throws Exception{
              Uri base=MediaStore.Audio.Media.EXTERNAL_CONTENT_URI;
              String[] p={MediaStore.Audio.Media._ID,MediaStore.Audio.Media.TITLE,MediaStore.Audio.Media.ARTIST};
              String s=MediaStore.Audio.Media.IS_MUSIC+"!=0 AND ("+MediaStore.Audio.Media.TITLE+" LIKE ? OR "+MediaStore.Audio.Media.ARTIST+" LIKE ?)";
              Cursor cur=getContentResolver().query(base,p,s,new String[]{"%"+q+"%","%"+q+"%"},null);
              if(cur==null||!cur.moveToFirst()){if(cur!=null)cur.close();return "I couldn't find "+q+" in local storage.";}
              long id=cur.getLong(0);String title=cur.getString(1),artist=cur.getString(2);cur.close();
              if(player!=null){try{player.stop();}catch(Exception ignored){}player.release();}
              player=MediaPlayer.create(this,ContentUris.withAppendedId(base,id)); if(player==null)return "I couldn't open that song.";
              player.start(); return "Playing "+title+(artist==null?"":" by "+artist)+".";
            }

            String call(String name){
              Cursor c=getContentResolver().query(ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                new String[]{ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME,ContactsContract.CommonDataKinds.Phone.NUMBER},
                ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME+" LIKE ?",new String[]{"%"+name+"%"},null);
              if(c==null||!c.moveToFirst()){if(c!=null)c.close();return "I couldn't find "+name+" in contacts.";}
              String n=c.getString(0),num=c.getString(1);c.close();
              startActivity(new Intent(Intent.ACTION_CALL,Uri.parse("tel:"+Uri.encode(num)))); return "Calling "+n+".";
            }

            String openApp(String name){
              PackageManager pm=getPackageManager();Intent q=new Intent(Intent.ACTION_MAIN);q.addCategory(Intent.CATEGORY_LAUNCHER);
              ResolveInfo best=null;for(ResolveInfo x:pm.queryIntentActivities(q,0)){String l=String.valueOf(x.loadLabel(pm));if(l.equalsIgnoreCase(name)){best=x;break;}if(best==null&&l.toLowerCase().contains(name.toLowerCase()))best=x;}
              if(best==null)return "I couldn't find the app "+name+".";
              startActivity(pm.getLaunchIntentForPackage(best.activityInfo.packageName));return "Opening "+best.loadLabel(pm)+".";
            }

            String alarm(String hhmm){
              try{String[] p=hhmm.split(":");int h=Integer.parseInt(p[0]),m=Integer.parseInt(p[1]);
                Intent i=new Intent(AlarmClock.ACTION_SET_ALARM).putExtra(AlarmClock.EXTRA_HOUR,h).putExtra(AlarmClock.EXTRA_MINUTES,m).putExtra(AlarmClock.EXTRA_MESSAGE,"IMAN");
                startActivity(i);return String.format(Locale.getDefault(),"Alarm set for %02d:%02d.",h,m);
              }catch(Exception e){return "I couldn't understand that alarm time.";}
            }

            String torch(boolean on)throws Exception{
              CameraManager cm=(CameraManager)getSystemService(CAMERA_SERVICE);
              for(String id:cm.getCameraIdList()){Boolean f=cm.getCameraCharacteristics(id).get(CameraCharacteristics.FLASH_INFO_AVAILABLE);if(Boolean.TRUE.equals(f)){cm.setTorchMode(id,on);return on?"Flashlight on.":"Flashlight off.";}}
              return "No flashlight was found.";
            }

            String vol(boolean up){AudioManager a=(AudioManager)getSystemService(AUDIO_SERVICE);a.adjustStreamVolume(AudioManager.STREAM_MUSIC,up?AudioManager.ADJUST_RAISE:AudioManager.ADJUST_LOWER,AudioManager.FLAG_SHOW_UI);return up?"Volume increased.":"Volume decreased.";}

            void say(String s){if(tts!=null)tts.speak(s,TextToSpeech.QUEUE_FLUSH,null,"iman");}
            String read(InputStream i)throws Exception{BufferedReader r=new BufferedReader(new InputStreamReader(i));StringBuilder b=new StringBuilder();String x;while((x=r.readLine())!=null)b.append(x);return b.toString();}

            void askPerms(){
              ArrayList<String> p=new ArrayList<>();
              String[] base={Manifest.permission.RECORD_AUDIO,Manifest.permission.READ_CONTACTS,Manifest.permission.CALL_PHONE,Manifest.permission.CAMERA};
              for(String x:base)if(checkSelfPermission(x)!=PackageManager.PERMISSION_GRANTED)p.add(x);
              if(Build.VERSION.SDK_INT>=33){if(checkSelfPermission(Manifest.permission.READ_MEDIA_AUDIO)!=PackageManager.PERMISSION_GRANTED)p.add(Manifest.permission.READ_MEDIA_AUDIO);}
              else if(checkSelfPermission(Manifest.permission.READ_EXTERNAL_STORAGE)!=PackageManager.PERMISSION_GRANTED)p.add(Manifest.permission.READ_EXTERNAL_STORAGE);
              if(!p.isEmpty())requestPermissions(p.toArray(new String[0]),PERMS);
            }

            TextView t(String s,int z,int c,boolean bold){TextView v=new TextView(this);v.setText(s);v.setTextSize(z);v.setTextColor(c);if(bold)v.setTypeface(android.graphics.Typeface.DEFAULT_BOLD);return v;}
            Button b(String s){Button x=new Button(this);x.setText(s);x.setAllCaps(false);return x;}
            LinearLayout.LayoutParams top(int m){LinearLayout.LayoutParams p=new LinearLayout.LayoutParams(-1,-2);p.setMargins(0,dp(m),0,0);return p;}
            int dp(int v){return Math.round(v*getResources().getDisplayMetrics().density);}
          }
          EOF

          cd "$P"
          gradle :app:assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/IMAN-AI-PHONE-ROBOT-REAL-v1.apk"

      - name: Verify APK
        run: |
          unzip -t out/IMAN-AI-PHONE-ROBOT-REAL-v1.apk >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/IMAN-AI-PHONE-ROBOT-REAL-v1.apk | head
          sha256sum out/IMAN-AI-PHONE-ROBOT-REAL-v1.apk > out/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: IMAN-AI-PHONE-ROBOT-REAL-v1
          path: out/*
          retention-days: 30